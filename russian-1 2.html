<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ОГЭ · Русский язык · Варианты 1–5</title>
<style>
:root{--bg:#0d0d1a;--s1:#161625;--s2:#1f1f35;--s3:#282840;--p:#b06dff;--g:#ffc94d;--gr:#00e5a0;--r:#ff4d6d;--t:#ede8ff;--m:#7a6fa0;--rad:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:'SF Pro Text','Helvetica Neue',Arial,sans-serif;padding-bottom:90px}
.hdr{padding:16px 18px 0}
.back{display:inline-flex;align-items:center;color:var(--p);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:10px;background:rgba(176,109,255,.12);padding:6px 14px;border-radius:20px}
.app-lbl{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--m)}
.app-title{font-size:20px;font-weight:800;margin-top:4px;margin-bottom:2px}
.app-sub{font-size:12px;color:var(--m);margin-bottom:14px}
.ovr{background:var(--s1);border-radius:12px;padding:12px 14px;margin:0 18px 12px}
.ovr-row{display:flex;justify-content:space-between;margin-bottom:6px}
.ovr-lbl{font-size:12px;color:var(--m)}
.ovr-val{font-size:12px;font-weight:800;color:var(--p)}
.ovr-bar{height:4px;background:var(--s3);border-radius:10px;overflow:hidden}
.ovr-fill{height:100%;background:var(--p);border-radius:10px;transition:width .4s}
.vgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px;margin-bottom:14px}
.vbtn{background:var(--s1);border:1.5px solid rgba(255,255,255,.07);border-radius:11px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s}
.vbtn.active{background:var(--p);border-color:var(--p)}
.vbtn.done{border-color:var(--gr)}
.vbtn.done .vn{color:var(--gr)}
.vn{font-size:14px;font-weight:800}
.vsc{font-size:10px;color:var(--m);margin-top:2px}
.vbtn.active .vsc{color:rgba(255,255,255,.7)}
.vc{padding:0 18px;display:none}
.vc.active{display:block}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px}
.txt-box{background:var(--s1);border-radius:var(--rad);padding:14px 16px;font-size:13px;line-height:1.85;margin-bottom:6px;border-left:3px solid var(--p);max-height:200px;overflow-y:auto}
.txt-box.exp{max-height:none}
.txt-more{text-align:center;font-size:12px;color:var(--p);cursor:pointer;padding:5px;margin-bottom:12px}
.sn{color:var(--m);font-size:11px}
.qw{background:var(--s1);border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid rgba(176,109,255,.08)}
.qn{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--p);margin-bottom:6px}
.qt{font-size:14px;line-height:1.55;font-weight:600;margin-bottom:10px}
.chkopts{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.cho{background:var(--s2);border:1.5px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 13px;font-size:13px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;line-height:1.5;transition:all .16s;user-select:none}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--m);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.cho.sel .cb{background:var(--p);border-color:var(--p);color:#fff}
.cho.correct{background:rgba(0,229,160,.1);border-color:var(--gr)}
.cho.correct .cb{background:var(--gr);border-color:var(--gr);color:#000}
.cho.wrong{background:rgba(255,77,109,.1);border-color:var(--r)}
.cho.wrong .cb{background:var(--r);border-color:var(--r);color:#fff}
.cho.missed{border-color:rgba(0,229,160,.4);background:rgba(0,229,160,.04)}
.cho.disabled{pointer-events:none}
.mcols{display:flex;gap:10px;margin-bottom:10px}
.mcol{flex:1}
.mct{font-size:10px;font-weight:700;color:var(--m);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.mi{background:var(--s2);border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;margin-bottom:6px}
.ml .mi{border-left:3px solid var(--p)}
.mr .mi{border-left:3px solid var(--g)}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.mc{background:var(--s2);border-radius:9px;padding:10px 8px;text-align:center}
.mclbl{font-size:11px;font-weight:800;color:var(--p);margin-bottom:5px}
.msel{width:100%;background:var(--s3);border:1.5px solid rgba(255,255,255,.07);border-radius:7px;color:var(--t);padding:6px 4px;font-size:14px;text-align:center;font-family:inherit}
.msel:focus{outline:none;border-color:var(--p)}
.msel.ok{border-color:var(--gr);background:rgba(0,229,160,.1)}
.msel.err{border-color:var(--r);background:rgba(255,77,109,.1)}
.ai-wrap{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ai{flex:1;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--t);font-family:inherit;transition:border-color .2s;letter-spacing:1px}
.ai:focus{outline:none;border-color:var(--p)}
.ai.ok{border-color:var(--gr);background:rgba(0,229,160,.07)}
.ai.err{border-color:var(--r);background:rgba(255,77,109,.07)}
.itxt{background:var(--s2);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.7;margin-bottom:10px;font-style:italic}
.chkbtn{width:100%;background:var(--p);border:none;color:#fff;padding:11px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
.chkbtn:active{transform:scale(.97)}
.fb{margin-top:10px;padding:11px 13px;border-radius:11px;font-size:12px;line-height:1.6;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(0,229,160,.08);border-left:3px solid var(--gr)}
.fb.err{background:rgba(255,77,109,.08);border-left:3px solid var(--r)}
.fbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.fb.ok .fbl{color:var(--gr)}
.fb.err .fbl{color:var(--r)}
.ans-hint{font-size:12px;color:var(--gr);margin:4px 0 6px}
.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,26,.96);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;padding:10px 18px max(10px,env(safe-area-inset-bottom));z-index:100}
.bot-info{font-size:12px;color:var(--m);text-align:center}
.botbtn{color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:9px 18px;background:var(--p);border-radius:20px;border:none;font-family:inherit}
.botbtn.ghost{background:rgba(176,109,255,.12);color:var(--p)}
.botbtn:disabled{opacity:.4;pointer-events:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--s1);border:1px solid rgba(176,109,255,.3);color:var(--t);padding:10px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.sc{background:var(--s1);border-radius:var(--rad);padding:14px;margin:14px 0;display:flex;align-items:center;gap:14px;border:1px solid rgba(0,229,160,.15)}
.scn{font-size:30px;font-weight:800;color:var(--gr)}
.sct{font-size:12px;color:var(--m)}
.scl{font-size:14px;font-weight:700;margin-bottom:2px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="hdr">
  <a href="index.html" class="back">← Назад</a>
  <div class="app-lbl">ОГЭ 2026 · Дощинский · ФИПИ</div>
  <div class="app-title">Русский язык · Варианты 1–5</div>
  <div class="app-sub">Задания 2–12 · С автопроверкой и пояснениями</div>
</div>
<div class="ovr">
  <div class="ovr-row"><div class="ovr-lbl">Прогресс</div><div class="ovr-val" id="ovrV">0%</div></div>
  <div class="ovr-bar"><div class="ovr-fill" id="ovrF" style="width:0%"></div></div>
</div>
<div class="vgrid" id="vg"></div>
<div id="vcs"></div>
<div class="bot">
  <button class="botbtn ghost" id="bPrev" onclick="nav(-1)" disabled>← Пред.</button>
  <div class="bot-info" id="bInfo">Вариант 1 из 5</div>
  <button class="botbtn" id="bNext" onclick="nav(1)">След. →</button>
</div>
<script>
const V=[
{n:1,
t1:`(1)Многим, вероятно, известны предания, стихотворения и песни, посвящённые белому аисту, спокойно расхаживающему по полю около села и обычно устраивающему гнездо из прутьев и веточек на кровле. (2)В гнёздах аисты высиживают от 3 до 5 яиц, из которых вылупляются долгоногие аистята. (3)Когда птенцы немного подрастут, они начнут с доверием посматривать на людей. (4)Аистята с нетерпением ждут с охоты своих родителей, которые по очереди приносят им в клювах лягушек, ящериц, грызунов и насекомых. (5)Сложно сказать, когда белые аисты сблизились с человеком, но люди очень ценят дружбу с ними и ждут, когда птицы поселятся на крышах домов, старательно ограждают их от излишнего беспокойства и даже уверены в том, что аисты способны приносить счастье.`,
t2:`(1)Пятый день несло непроглядной вьюгой. (2)В белом от снега и холодном хуторском доме стоял бледный сумрак и было большое горе: был тяжело болен ребёнок. (3)И в жару, в бреду он часто плакал и всё просил дать ему какие-то красные лапти. (4)И мать, не отходившая от постели, где он лежал, тоже плакала горькими слезами — от страха и от своей беспомощности. (5)Что сделать, чем помочь? (6)Муж в отъезде, лошади плохие, а до больницы, до доктора, тридцать вёрст, да и не поедет никакой доктор в такую страсть...
(7)Стукнуло в прихожей — Нефёд принёс соломы на топку, свалил её на пол, отдуваясь, утираясь, дыша холодом и вьюжной свежестью, приотворил дверь, заглянул.
— Ну что, барыня, как? Куда там, Нефёдушка! Верно, и не выживет! Всё какие-то красные лапти просит...
— Значит, надо добывать. Значит, душа желает. Надо добывать.
(31)И, притворив дверь, ушёл. Взял в руки кнут и вышел вон, пошёл, утопая по сугробам, через двор, выбрался за ворота и потонул в белом, куда-то бешено несущемся степном море.
(47)Это были новосельские мужики, привёзшие мёртвое тело, — белого, мёрлого, всего забитого снегом, навзничь лежавшего в санях Нефёда.
(51)За пазухой Нефёда лежали новенькие ребячьи лапти и пузырёк с фуксином.
(По И. А. Бунину*)`,
qs:[
{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа в одном из предложений или в одной из частей сложного предложения текста. Запишите номера ответов.',opts:['1) известны предания (предложение 1)','2) вылупляются аистята (предложение 2)','3) птенцы начнут посматривать (предложение 3)','4) которые приносят (предложение 4)','5) сложно сказать (предложение 5)'],ans:[2,4,5],exp:'<b>1)</b> Неверно — «известны» без подлежащего, предания — подлежащее, но сказуемое «известны» — краткое прилагательное ✗. <b>2)</b> «вылупляются аистята» ✓. <b>4)</b> «которые приносят» — придаточная часть ✓. <b>5)</b> «сложно сказать» — безличное предложение ✓. <b>Ответ: 245</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов, в которых даны верные характеристики предложений текста. Запишите номера ответов.',opts:['1) В предложении 1 содержится простое глагольное сказуемое.','2) Предложение 2 сложноподчинённое с придаточным определительным.','3) Первая часть сложного предложения 3 — односоставное неопределённо-личное.','4) Предложение 4 сложносочинённое.','5) Предложение 5 содержит 5 (пять) грамматических основ.'],ans:[2,5],exp:'<b>2)</b> «из которых вылупляются» — придаточное определительное ✓. <b>5)</b> Предложение 5 содержит 5 грамматических основ ✓. <b>Ответ: 25</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Если обобщающее слово стоит перед однородными членами, то после него ставится двоеточие.','Б) Между частями сложноподчинённого предложения ставится запятая.','В) Определение, выраженное причастным оборотом, стоящим после определяемого слова, обособляется.'],right:['1) На солнце нельзя было взглянуть: ослепительными потоками его свет лился с вышины.','2) Дрозды собираются в большие стаи, улетают в сады, куда их манят красные кисти рябины.','3) День был солнечный, ласковый, и на душе стало спокойно и легко.','4) Лунной ночью всё вокруг: и старые берёзы, застилавшие дорогу своими тенями, и блеск пруда, и сверкающие капли росы — приобретало таинственный смысл.','5) Дома и мостовая, пристань и лодки были влажными от тумана, окутавшего город.'],ans:{A:'4',B:'2',C:'5'},exp:'<b>А)</b> «всё вокруг: и берёзы...» — обобщающее слово перед однородными → предложение 4 ✓.<br><b>Б)</b> «улетают в сады, куда их манят» — СПП → предложение 2 ✓.<br><b>В)</b> «от тумана, окутавшего город» — причастный оборот → предложение 5 ✓.<br><b>Ответ: А–4, Б–2, В–5</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должны стоять запятые.',text:'Особенно много колосистой травы и цветов (1) росло около старых пней. Трухлявые эти пни (2) разваливались от лёгкого толчка ногой. Тогда взлетала тёмным облаком коричневая (3) как размолотый кофе (4) пыль (5) и в открывшихся внутри пня запутанных и таинственных ходах (6) проточенных короедами (7) начинали суетиться крылатые муравьи (8) и плоские чёрные жуки в красных погонах (9) похожие на военных музыкантов.',ans:'3456789',exp:'3 — сравнительный оборот «как размолотый кофе». 4 — перед «пыль». 5 — запятая. 6,7 — причастный оборот «проточенных короедами». 8 — перед «и». 9 — причастный оборот «похожие на военных музыкантов». <b>Ответ: 3456789</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова. Запишите номера ответов.',opts:['1) БЕСЦЕЛЬНЫЙ — на конце приставки перед глухим согласным пишется С.','2) НЕГРОМКИЙ — НЕ с прилагательным слитно, т.к. слово без НЕ не употребляется.','3) В ТЕЧЕНИЕ (года) — на конце производного предлога пишется Е.','4) ЗАТЕЯННЫЙ — гласная Я перед НН зависит от основы глагола (затеЯть).','5) НЕ ДОЛЖЕН — частица НЕ с глаголом пишется раздельно.'],ans:[1,3],exp:'<b>1)</b> БЕС+цельный: перед Ц (глухой) → БЕС- ✓. <b>3)</b> «В течение» — производный предлог, на конце Е ✓. <b>4)</b> ЗАТЕЯННЫЙ — от «затеять»: верно, но суффикс -НН- объясняется иначе ✗. <b>5)</b> «должен» — краткое прилагательное ✗. <b>Ответ: 13</b>'},
{id:'7',type:'i',inputType:'digits',task:'Прочитайте текст. Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква И.',text:'Ещё только одиннадцатый час на исход..(1), а уже н..(2)куда н..(3) ден..(4)шься от т..(5)жёлого зноя, каким дыш..(6)т июльский полд..(7)нь. Раскалённый воздух едва колыш..(8)тся над немощёной п..(9)щаной дорогой.',ans:'26',exp:'<b>2)</b> нИкуда — приставка НИ (безударная) ✓. <b>6)</b> дышИт — глагол II спряжения (дышать) → И ✓. Остальные цифры: И там не пишется. <b>Ответ: 26</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «заморозки» в соответствующей форме, соблюдая нормы современного русского литературного языка.',text:'Пришёл ноябрь — месяц первых (заморозки).',ans:'заморозков',exp:'«Месяц чего?» — Р.п. мн.ч.: <b>заморозков</b>. Ответ: заморозков'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «пенал ученика», построенное на основе управления, синонимичным словосочетанием со связью согласование.',ans:'ученический пенал',exp:'Управление (пенал кого? ученика) → согласование (прилагательное + существительное): <b>ученический пенал</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) В хуторском доме тяжело болел ребёнок.','2) Вьюга не повлияла на решение Нефёда идти за лаптями.','3) Нефёд вернулся из Новосёлок на следующий день.','4) К вечеру ребёнку полегчало, он перестал бредить.','5) Нефёд на обратном пути замёрз в снегу.'],ans:[1,2,5],exp:'<b>1)</b> «тяжело болен ребёнок» ✓. <b>2)</b> Нефёд ушёл несмотря на вьюгу ✓. <b>3)</b> Он не вернулся живым ✗. <b>4)</b> В тексте не сказано ✗. <b>5)</b> «мёртвое тело... забитого снегом Нефёда» ✓. <b>Ответ: 125</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности речи является эпитет. Запишите номера ответов.',opts:['1) Пятый день несло непроглядной вьюгой.','2) В белом от снега и холодном хуторском доме стоял бледный сумрак.','3) Весь дом гудел, ужасала одна мысль о бездне снежного урагана.','4) Сальная свеча пылала дрожащим хмурым пламенем.','5) Тем только и спаслись — поняли, что эти луга хуторские, и что на горе жильё...'],ans:[1,2,4],exp:'Эпитет — образное художественное определение. <b>1)</b> «непроглядной» вьюгой ✓. <b>2)</b> «бледный» сумрак ✓. <b>3)</b> «снежного урагана» — можно считать эпитетом, но скорее метафора. <b>4)</b> «дрожащим хмурым» пламенем ✓. <b>Ответ: 124</b>'},
{id:'12',type:'i',inputType:'word',task:'В предложениях 47–51 найдите слово с лексическим значением «краситель ярко-красного цвета». Выпишите это слово.',ans:'фуксин',exp:'<b>Фуксин</b> — анилиновый краситель ярко-красного цвета. «За пазухой Нефёда лежали новенькие ребячьи лапти и пузырёк с фуксином». Ответ: фуксин'},
]},
{n:2,
t1:`(1)Слово «акварель» образовано на основе слова «аква», что в переводе с латыни значит «вода». (2)Об этих водяных, полупрозрачных красках знали ещё в древние времена, но мастера Древнего Египта и античного мира добавляли в них белый пигмент, и изображение становилось непрозрачным. (3)Без примеси белого пигмента акварель стали использовать с XV века. (4)С помощью акварели можно передать картины ранней весны с её говорливыми ручейками, высотой синего неба, хрустально-прозрачной прохладой солнечного утра и свежестью пашен и дубрав. (5)Превосходные по красоте акварели создавали замечательные русские художники, среди которых В. И. Суриков, И. Е. Репин, М. А. Врубель, В. А. Серов, П. П. Кончаловский.`,
t2:`(1)Вечер стоял прекрасный. (2)Небо тёмно-синее, чистое, всё звёздочками усеяно, а звёздочки так и мигают в безбрежной высоте, точно улыбаются оттуда. (3)Снег, как белой скатертью, обтянул все улицы. (4)Идёшь — под ногами хрустит. (5)И что-то праздничное, бодрящее разлито в воздухе, будто не только люди, но и вся природа напряжённо и нетерпеливо ждёт Рождества.
(75)Мне было жалко, что мы остались без ёлки, но в то же время чувствовалось, что дело сделано хорошее... (76)Я сердцем сознавал, что, поступи мы иначе, может быть, воспоминание о рыдающей старухе отравило бы всё наше веселье...
(77)Мы остались без ёлки — и всё-таки нам было весело... (78)Это было то внутреннее, глубокое счастье, которое испытываешь только тогда, когда чувствуешь себя виновником чужой радости.
(По А. В. Круглову*)`,

{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) значит «вода» (предложение 1)','2) знали мастера (предложение 2)','3) акварель стали использовать (предложение 3)','4) можно передать (предложение 4)','5) создавали художники (предложение 5)'],ans:[4,5],exp:'<b>4)</b> «можно передать» — безличное предложение ✓. <b>5)</b> «создавали художники» ✓. <b>Ответ: 45</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 содержит 3 грамматические основы.','2) Первая часть предложения 2 — односоставное неопределённо-личное.','3) Предложение 3 простое неполное.','4) В предложении 4 содержится составное глагольное сказуемое.','5) Вторая часть предложения 5 осложнена однородными подлежащими.'],ans:[2,4,5],exp:'<b>2)</b> «знали» — нет подлежащего → неопределённо-личное ✓. <b>4)</b> «можно передать» — составное глагольное ✓. <b>5)</b> Вторая часть осложнена однородными подлежащими ✓. <b>Ответ: 245</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Вводное слово выделяется запятыми.','Б) Между подлежащим и сказуемым — именами существительными — ставится тире.','В) Согласованное приложение после определяемого слова выделяется тире.'],right:['1) Над берегом реки, отразившись в зеркале воды, пролетел лазурный зимородок — райская птица наших краёв.','2) Одуванчики — самый распространённый медонос среди растений нашей страны, потому что они цветут раньше черёмухи, сирени, акации.','3) «Знаки препинания существуют, чтобы выделить мысль», — отмечал писатель К. Г. Паустовский.','4) Яблоко, огурец, листья салата — всё это черепашки поглощали с огромным удовольствием.','5) Ты, верно, Моцарт, чем-нибудь расстроен?'],ans:{A:'5',B:'2',C:'1'},exp:'<b>А)</b> «верно» — вводное слово → предложение 5 ✓. <b>Б)</b> «Одуванчики — медонос»: оба существительные → предложение 2 ✓. <b>В)</b> «зимородок — райская птица»: приложение → предложение 1 ✓. <b>Ответ: А–5, Б–2, В–1</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должны стоять запятые.',text:'Заросшая дорога (1) ведёт через старый (2) сосновый лес. Он растёт на песчаных холмах (3) сменяющих друг друга с равномерностью широких (4) морских валов. Эти холмы (5) остатки ледниковых наносов. На вершинах их цветёт много колокольчиков (6) а низины сплошь заросли (7) папоротником. Листья его (8) с изнанки покрыты спорами (9) похожими на красноватую пыль.',ans:'369',exp:'<b>3</b> — причастный оборот «сменяющих друг друга». <b>6</b> — запятая перед союзом А в ССП. <b>9</b> — причастный оборот «похожими на красноватую пыль». <b>Ответ: 369</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания выделенного слова. Запишите номера ответов.',opts:['1) ЗАМИРАТЬ — безударная чередующаяся гласная в корне зависит от суффикса -А-.','2) КОМАРИНЫЙ — прилагательное с суффиксом -ИН- пишется с одной Н.','3) ТРЁХЭТАЖНЫЙ — сложное числительное пишется слитно.','4) НЕ ПРОЧИТАНА (книга) — НЕ с деепричастием пишется раздельно.','5) ПРИЛЕЧЬ — Ь после шипящего в инфинитиве.'],ans:[1,4,5],exp:'<b>1)</b> замИрать: МИР-/МЕР-, перед -А- → И ✓. <b>4)</b> НЕ ПРОЧИТАНА — НЕ с кратким причастием раздельно ✓. <b>5)</b> прилечЬ: Ь в инфинитиве после шипящего ✓. <b>Ответ: 145</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква Е.',text:'Дремл..(1)т без ж..(2)вительной влаг..(3) зел..(4)нь рощ и паш..(5)н. Что-то н..(6)внятное непр..(7)станно шепч..(8)т неугомонный кузнеч..(9)к.',ans:'125678',exp:'<b>1)</b> дремлЕт (I спр.) <b>2)</b> жЕвительной — Е ✓. <b>5)</b> пашЕн — Е ✓. <b>6)</b> шЕпчет — Е ✓. <b>7)</b> — Е ✓. <b>8)</b> кузнЕч — Е ✓. <b>Ответ: 125678</b>'},

{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) События происходили вечером накануне Рождества.','2) Мальчики мечтали купить на ярмарке ёлку.','3) Мальчики зашли на вокзал, чтобы проводить уезжающего товарища.','4) Старушка просила окружающих купить ей новый билет.','5) Мальчики нашли билет старушки около двери на вокзале.'],ans:[1,3,5],exp:'<b>1)</b> «Вечер стоял прекрасный», канун Рождества ✓. <b>3)</b> Шли провожать товарища ✓. <b>5)</b> Нашли билет ✓. <b>2)</b> Мальчики мечтали, но цель была проводить товарища. <b>4)</b> Старушка не просила купить — мальчики сами купили. <b>Ответ: 135</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является сравнение. Запишите номера ответов.',opts:['1) Снег, как белой скатертью, обтянул все улицы.','2) Мы с Петей вопросительно посмотрели друг на друга и бросились туда.','3) Рыдания душили её.','4) Петя побежал от неё с такой поспешностью, будто он спасался от погони.','5) Едва переводя дух, уставшие, остановились мы посреди улицы.'],ans:[1,4],exp:'<b>1)</b> «как белой скатертью» — сравнение с союзом КАК ✓. <b>4)</b> «будто он спасался от погони» — сравнение с союзом БУДТО ✓. <b>3)</b> «рыдания душили» — метафора. <b>Ответ: 14</b>'},

{n:3,
t1:`(1)Акробатика — основа циркового искусства: многие из тех, кто желает выступать в цирке, должны в первую очередь научиться безукоризненно управлять своим телом. (2)Именно по этой причине акробатика обязательна для воздушных гимнастов, которые перелетают под куполом цирка с трапеции на трапецию, канатоходцев, скользящих по проволоке, жонглёров, словно играючи подкидывающих различные предметы, жокеев на отчаянных скакунах и даже клоунов. (3)В настоящее время акробатика признана одним из видов спорта. (4)И пусть акробаты не принимают участия в Олимпийских играх, но они выступают на чемпионатах по спортивной акробатике, где показывают арбитрам и зрителям свои умения в различных видах упражнений: поддержках, сальто, кувырках, стойках, пирамидах. (5)Выступления акробатов демонстрируют их ловкость, гибкость, быструю реакцию.`,
t2:`(1)Люся легла в кроватку. (2)На ночном столике аккуратно разложила свои любимые вещи: камушек с океана, китайскую собачку и басни Крылова и, как всегда перед сном, стала думать о разных разностях...
(12)Кто это у кроватки раскашлялся? (13)Люся открыла глаза — удивительно! (14)В комнате голубой молочный свет. (15)Под табуреткой, в ногах постели колышется облако. (16)На табуретке сидит добродушный грузный старик и ухмыляется...
(34)Вот ваша басня «Лебедь, щука и рак». Вы как думаете, дедушка, если бы они все вместе в одну сторону потянули, телега бы покатилась?
— Ни за что бы не покатилась! (39)Мы летом жили на даче. (40)И на дворе стояла телега. (41)Боря храбрый: привязал к телеге собаку, гуся и котёнка... (42)Стали мы их погонять, они все в одну сторону потянули, а телега ни с места. (43)Вот вам и «мораль».
(По С. Чёрному*)`,

{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 сложное с бессоюзной и подчинительной связью.','2) В первой части предложения 2 содержится простое глагольное сказуемое.','3) Предложение 3 по цели высказывания побудительное.','4) Предложение 4 содержит 3 грамматические основы.','5) Предложение 5 простое, осложнённое однородными дополнениями.'],ans:[1,4,5],exp:'<b>1)</b> «акробатика — основа: многие должны» — бессоюзная + «кто желает» — подчинение ✓. <b>5)</b> Однородные дополнения: ловкость, гибкость, реакцию ✓. <b>3)</b> Предл.3 — повествовательное. <b>Ответ: 15</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Определение, выраженное причастным оборотом после определяемого слова, обособляется.','Б) Обстоятельство, выраженное сравнительным оборотом, обособляется.','В) Между частями сложноподчинённого предложения ставится запятая.'],right:['1) Терраса была засыпана снегом, и я стоял на ней, дыша холодным воздухом зимы.','2) Темнота могла избавить меня от опасности, как вдруг, оглянувшись, увидел я, что Савельича не было.','3) Пароход, покрытый чёрными клубами дыма, дал последний гудок и отчалил от берега.','4) Из трубы в тёмно-синее небо валит дым, а над ним мигают, как голубые глаза, ясные звёзды.','5) Катя стащила перчатки, сняла шляпу, поправила волосы, и всё это время лукавая усмешка морщила её губы.'],ans:{A:'3',B:'4',C:'2'},exp:'<b>А)</b> «покрытый чёрными клубами дыма» — причастный оборот → предложение 3 ✓. <b>Б)</b> «как голубые глаза» — сравнительный оборот → предложение 4 ✓. <b>В)</b> «как вдруг... увидел я, что» — СПП → предложение 2 ✓. <b>Ответ: А–3, Б–4, В–2</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должны стоять запятые.',text:'Кучевые облака громоздились в небе. Они были на первый взгляд (1) такие тугие (2) что можно было (3) очевидно (4) лежать на их ослепительных громадах и смотреть (5) оттуда на приветливую землю с её лесами (6) просеками (7) полянами (8) цветущей рожью (9) и пёстрыми стадами.',ans:'2346789',exp:'<b>1,2</b> — «такие тугие, что» (придаточное следствия). <b>3,4</b> — вводное слово «очевидно». 6,7,8 — однородные члены, но перед И запятая не нужна. <b>Ответ: 1234</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания выделенного слова. Запишите номера ответов.',opts:['1) БАДМИНТОН — безударная гласная проверяется подбором однокоренных слов.','2) ГОЛУБОГЛАЗЫЙ — сложное прилагательное из подчинительного словосочетания пишется слитно.','3) (записал) КАРАНДАШОМ — в суффиксе существительного после шипящего под ударением О.','4) ПОСЕЯВШИЙ — перед -ВШ- пишется та же буква, что перед -ТЬ в инфинитиве.','5) ВИДИМО-НЕВИДИМО — дефис при сложении основ с одним корнем.'],ans:[2,4,5],exp:'<b>2)</b> голубые глаза → голубоглазый: подчинительное словосочетание → слитно ✓. <b>4)</b> посеЯть → посеЯвший ✓. <b>5)</b> повтор корня → дефис ✓. <b>1)</b> Бадминтон — словарное, нельзя проверить ✗. <b>Ответ: 245</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква О.',text:'П..(1)луденное солнце, готов..(2)е пор..(3)зить каждым своим луч..(4)м, жж..(5)т невыносим..(6). Бесшумн..(7) струится чистая вода, з..(8)вущая освежить ист..(9)млённое зноем тело в прохладной глубине.',ans:'1246789',exp:'Пишется О во всех позициях где гласная под ударением после шипящего или в корне ОВ-. <b>Ответ: 1246789</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «окрепнуть» в соответствующей форме.',text:'За лето, проведённое у бабушки, малыш (окрепнуть).',ans:'окреп',exp:'Прошедшее время, м.р., ед.ч.: <b>окреп</b> (без суффикса -Л-, т.к. основа на согласный). Ответ: окреп'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «вечернее небо» (согласование) синонимичным со связью примыкание.',ans:'небо вечером',exp:'Согласование → примыкание (наречие): <b>небо вечером</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) Маленькая девочка Люся — внимательная читательница.','2) Люся по-своему понимала значение слова «мораль».','3) Крылов считал, что Люся не поняла смысл его басни.','4) «Однажды вол, медведь и лошадь Везти с поклажей воз взялись...» — точная цитата из Крылова.','5) Баснописец Крылов был рад, что его басни с интересом читают.'],ans:[1,2,5],exp:'<b>1)</b> Люся читает басни и задаёт умные вопросы ✓. <b>2)</b> Она проверила мораль на практике ✓. <b>5)</b> Крылов улыбнулся и был рад ✓. <b>4)</b> У Крылова «Лебедь, Щука и Рак», а не вол с медведем — Люся перепутала ✗. <b>Ответ: 125</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является эпитет. Запишите номера ответов.',opts:['1) Днём ведь думать трудно: то школа, то уроки, то всякие домашние разговоры.','2) В комнате голубой молочный свет.','3) На табуретке сидит добродушный грузный старик и ухмыляется...','4) Муравей, по-моему, безжалостный грубиян.','5) Я тоже муравья не совсем одобряю.'],ans:[2,3],exp:'<b>2)</b> «голубой молочный» свет — образные определения ✓. <b>3)</b> «добродушный грузный» старик ✓. <b>Ответ: 23</b>'},
{id:'12',type:'i',inputType:'word',task:'В предложениях 68–71 найдите один фразеологизм. Выпишите этот фразеологизм.',ans:'ни с места',exp:'«Телега ни с места» — фразеологизм со значением «не двигаться». <b>Ответ: ни с места</b>'},

{n:4,
t1:`(1)Люди не любят и боятся акул: эти хищные рыбы портят рыболовные сети, поедают улов рыбаков, время от времени совершают нападения на человека. (2)В пасти акулы, напоминающей поперечный неширокий разрез, расположено несколько рядов остроконечных зубов. (3)Её кожа покрыта чешуёй с острыми наростами, которые могут нанести глубокие повреждения любому живому существу. (4)Отдельные виды этих рыб имеют яркие отличительные особенности: голова акулы-молота напоминает гигантский молоток; у пилонóса костяной нарост на передней части головы, усыпанный колючками по краям, и правда похож на пилу. (5)Эти доисторические существа размножаются, откладывая крупные икринки, покрытые кожистой оболочкой, или рождают живых детёнышей; акулы о своём потомстве не заботятся.`,
t2:`(1)Все люди нашего круга в городе учили детей музыке. (2)Город был охвачен этим безумием. (3)Когда мальчику исполнялось четыре-пять лет, мать вела это крохотное существо к господину Загурскому, который содержал фабрику вундеркиндов в кружевных воротничках и лаковых туфельках.
(18)Нагруженный футляром и нотами, я три раза в неделю тащился к Загурскому.
(41)Я так и знал, что ты пописываешь, — сказал Никитич, — у тебя и взгляд такой, ты всё больше никуда не смотришь...
(43)Надо думать, — произнёс он врастяжку, — в тебе есть искра божия...
(57)И ты осмеливаешься писать? (58)Человек, не живущий в природе, как живёт в ней камень или животное, не напишет за всю жизнь двух стоящих строк... (59)Твои пейзажи похожи на описание декораций.
(По И. Э. Бабелю*)`,

{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) люди не любят и боятся (предложение 1)','2) в пасти расположено (предложение 2)','3) могут нанести (предложение 3)','4) молоток похож на пилу (предложение 4)','5) акулы не заботятся (предложение 5)'],ans:[1,5],exp:'<b>1)</b> «люди не любят и боятся» — однородные сказуемые ✓. <b>3)</b> «(которые) могут нанести» — составное гл. ✓. <b>5)</b> «акулы не заботятся» ✓. <b>2)</b> Подлежащее «несколько рядов», сказуемое «расположено» — верно, но формулировка «в пасти расположено» ✗. <b>Ответ: 135</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 простое, осложнённое однородными членами с обобщающим словом.','2) Предложение 2 сложноподчинённое.','3) В первой части предложения 3 содержится составное именное сказуемое.','4) Последняя часть предложения 4 осложнена деепричастным оборотом.','5) Предложение 5 бессоюзное сложное.'],ans:[3,5],exp:'<b>3)</b> В первой части сложного предложения 3 содержится составное именное сказуемое «покрыта» ✓. <b>5)</b> «Эти существа размножаются; акулы не заботятся» — бессоюзное сложное ✓. <b>Ответ: 35</b>''},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Уточняющее обстоятельство обособляется.','Б) Между частями сложноподчинённого предложения ставится запятая.','В) Если вторая часть бессоюзного сложного предложения поясняет первую, ставится двоеточие.'],right:['1) Снега ещё нет, и дорожка парка усеяна разноцветным ковром опавших листьев, красных, жёлтых, багровых.','2) В своих героях М. Горький любил то же, что ценил в самом себе: силу, храбрость, готовность постоять за себя.','3) Вчера вечером я приехал в Пятигорск и нанял квартиру на краю города, на самом высоком месте, у подножия горы Машук.','4) Движение Венеры уникально: она вращается с востока на запад синхронно с Землёй.','5) Директор усадил Ольгу на диван и попросил разрешения дописать важное письмо.'],ans:{A:'3',B:'2',C:'4'},exp:'<b>А)</b> «на краю города, на самом высоком месте» — уточнение → предложение 3 ✓. <b>Б)</b> «что ценил в самом себе» — СПП → предложение 2 ✓. <b>В)</b> «уникально: она вращается» — пояснение → предложение 4 ✓. <b>Ответ: А–3, Б–2, В–4</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должно стоять двоеточие.',text:'Гроза бушевала долго (1) в течение целого часа сверкали молнии (2) поминутно гремел гром. Мальчики что-то кричали друг другу (3) но воющий ветер и громовые раскаты (4) почти заглушали их крик. Ребята решили (5) нужно бежать под защиту дуба (6) который стоит на берегу. При непрерывном сверкании молний мало-помалу всё вырисовывалось (7) гнущиеся деревья (8) бушующая река (9) смутные очертания утёсов.',ans:'157',exp:'<b>1)</b> «Гроза бушевала долго: сверкали молнии» — пояснение. <b>5)</b> запятая. <b>7)</b> «всё вырисовывалось: гнущиеся деревья» — двоеточие после обобщающего слова. <b>Ответ: 157</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания. Запишите номера ответов.',opts:['1) РАЗГОРЕЛСЯ (спор) — в корне непроверяемая гласная.','2) ЦЫПЛЯЧИЙ (цвет) — написание Ы после Ц является исключением.','3) ГАЗИРОВАННАЯ (вода) — НН определяется наличием суффикса -ОВА-.','4) ОТТЕРЕТЬ (от пятен) — на конце приставки перед глухим пишется Т.','5) СВЕРХЪЕСТЕСТВЕННЫЙ — Ъ после приставки на согласный перед Е.'],ans:[2,3,5],exp:'<b>2)</b> ЦЫПЛЯЧИЙ — написание Ы после Ц является исключением ✓. <b>3)</b> ГАЗИРОВАННАЯ: суффикс -ОВА- + -НН- ✓. <b>5)</b> СВЕРХЪЕСТЕСТВЕННЫЙ: Ъ после приставки на согласный перед Е ✓. <b>Ответ: 235</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква А.',text:'Гр..(1)за надвигается: изредк..(2) вд..(3)леке вспыхнет молния, слышится слабый гул, постепенн..(4) усилив..(5)ющийся, переходящий в прерывистые р..(6)скаты, обнимающие весь г..(7)ризонт. Но вот солнце скрыл..(8)сь, и окрестность вмиг измени́л..(9)сь.',ans:'23569',exp:'<b>2)</b> изредкА ✓. <b>3)</b> вдАлеке ✓. <b>5)</b> постепеннО ✓. <b>6)</b> рАскаты ✓. <b>9)</b> изменилАсь ✓. <b>Ответ: 23569</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «выздороветь» в соответствующей форме.',text:'Врач пообещал, что пациент скоро (выздороветь).',ans:'выздоровеет',exp:'Будущее время, 3 л. ед.ч.: <b>выздоровеет</b>'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «акварельный этюд» (согласование) синонимичным со связью управление.',ans:'этюд акварелью',exp:'Согласование → управление (Т.п.): <b>этюд акварелью</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) Героя-рассказчика отдали учиться музыке в восемь лет.','2) Герой прогуливал занятия и проводил время на море.','3) Ефим Никитич догадался, что герой любит сочинять.','4) По мнению Ефима Никитича, писатель должен знать природу.','5) Герою было стыдно за то, что он прогуливал уроки.'],ans:[2,3,4],exp:'<b>3)</b> «Я так и знал, что ты пописываешь» ✓. <b>4)</b> «Человек, не живущий в природе, не напишет двух строк» ✓. <b>1)</b> «Мне шёл четырнадцатый год» ✗. <b>Ответ: 34</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является метафора. Запишите номера ответов.',opts:['1) Мать вела крохотное существо к Загурскому, который содержал фабрику вундеркиндов.','2) Проигрывая упражнения, я ставил книги на пюпитре и пожирал страницу за страницей.','3) Твои пейзажи похожи на описание декораций.','4) Старик тыкал палкой во все деревья и заставлял слушать птичьи голоса.','5) В моей крепости я досидел до ночи.'],ans:[1,2,5],exp:'<b>1)</b> «фабрика вундеркиндов» — метафора ✓. <b>2)</b> «пожирал страницу» — метафора ✓. <b>5)</b> «моей крепости» — метафора ✓. <b>3)</b> «похожи на» — сравнение. <b>Ответ: 125</b>'},
{id:'12',type:'i',inputType:'word',task:'В предложениях 3–8 найдите слово с лексическим значением «человек, в совершенстве владеющий техникой своего искусства». Выпишите это слово.',ans:'виртуоз',exp:'<b>Виртуоз</b> — мастер, в совершенстве владеющий техникой. «Они становились прославленными виртуозами». Ответ: виртуоз'},

{n:5,
t1:`(1)Не так много на земле стран, где люди не знали бы сказок Андерсена: с ранних лет живут с нами холодная и безразличная Снежная королева и хрупкая Дюймовочка, скромная Ромашка и гадкий утёнок. (2)В сказках Андерсена есть всё, что должно навсегда остаться в сердце человека: уважение к мужеству, милосердие и сострадание ко всем, кому приходится нелегко. (3)Трогательные истории сближают беду и счастье, слёзы и улыбку — всё, что происходит в жизни. (4)Андерсен был выдающимся писателем и понимал, что даже самая волшебная сказка должна отражать и печальные стороны действительности, которые с детства он очень хорошо знал. (5)В сказках Андерсена заложено много мудрых мыслей, поэтому они радуют людей с раннего детства до глубокой старости.`,
t2:`(1)Андрей родился и рос в Калуге. (2)На окраине стоял бревенчатый просторный дом. (3)Когда приходила весна, весь дом наполнялся запахами земли, листвы, сада. (4)Комнаты были прохладные, полы крашеные, чисто вымытые, а в раскрытые окна бежал ветер.
(5)И теперь, когда Андрей стал взрослым, каждая новая весна несла ему эти незабываемые запахи его детства — земли, травы, ветра.
(53)«Здравствуй!» — это слово означало, что начинался день, что они будут вместе. (54)И сейчас, уже взрослым, увидев чашку с молоком, он вспоминал ту белую в красных горошинах чашку, которая ждала его когда-то на кухонном столе. (55)Придя из школы, он останавливался у порога и переобувался, чтобы не наследить в комнатах. (56)И горячая плита, и потрескиванье дров, и чашка с молоком, и простое слово «Здравствуй!» — всё это наполняло его ощущением покоя.
(По Ф. А. Вигдоровой*)`,

{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Сложное предложение 1 содержит придаточное определительное.','2) Вторая часть предложения 2 содержит составное именное сказуемое.','3) Первая часть предложения 3 осложнена однородными членами с обобщающим словом.','4) Предложение 4 сложноподчинённое с последовательным подчинением придаточных.','5) Предложение 5 содержит 3 грамматические основы.'],ans:[1,3,4],exp:'<b>1)</b> Предложение 1 содержит придаточное определительное ✓. <b>3)</b> Первая часть осложнена однородными членами ✓. <b>4)</b> Предложение 4 — последовательное подчинение ✓. <b>Ответ: 134</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Определение, выраженное причастным оборотом после определяемого слова, обособляется.','Б) Согласованное приложение после определяемого слова выделяется тире.','В) Между частями сложноподчинённого предложения ставится запятая.'],right:['1) Я вышел из дома: нужно было встретить друга, который приехал навестить меня.','2) Пух одуванчика в воздухе, красный клевер в цвету, распустившийся дуб — всё это приметы наступившего лета.','3) Археология — наука, изучающая быт и культуру народа по сохранившимся памятникам.','4) Галилео Галилей — итальянский физик, математик, астроном — в 1610 году впервые наблюдал фазы изменения Венеры.','5) В начале апреля стояли тёплые дни и морозные ночи, зима не уступала, но один солнечный денёк пересилил, и потекли ручьи.'],ans:{A:'3',B:'4',C:'1'},exp:'<b>А)</b> «изучающая быт и культуру народа» — причастный оборот → предложение 3 ✓. <b>Б)</b> «Галилео Галилей — итальянский физик, математик, астроном» — приложение → предложение 4 ✓. <b>В)</b> «который приехал навестить» — СПП → предложение 1 ✓. <b>Ответ: А–3, Б–4, В–1</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должно стоять двоеточие.',text:'Земля (1) скованная стужей (2) была тверда (3) точно камень. И всё на ней хрустело и шуршало под ногами (4) и побитые травы (5) и мох (6) и опавшая листва. Чуткое ухо издалека могло определить (7) лесным бездорожьем бредут сотни людей. Вечерело. Иногда сквозило такой стужей (8) что пронизывало до костей. Люди горбились (9) жались друг к другу и стучали сапогами.',ans:'125',exp:'<b>4)</b> «всё на ней: и травы, и мох» — обобщающее слово «всё» перед однородными ✓. <b>7)</b> «определить: лесным бездорожьем бредут» — пояснение ✓. <b>Ответ: 47</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания. Запишите номера ответов.',opts:['1) НЕСВОБОДА — существительное пишется с НЕ слитно, т.к. без НЕ не употребляется.','2) РАСТАПЛИВАТЬ (масло) — в корне с чередованием перед -СТ- пишется А.','3) БЫЛИННЫЙ — прилагательное от существительного с основой на -Н- пишется с НН.','4) СЛЫШИМЫЕ (вдалеке) — гласная в суффиксе причастия зависит от спряжения глагола.','5) СКОЛЬЗКИЙ — Ь обозначает мягкость предшествующего согласного.'],ans:[1,2,3,4,5,6,7],exp:'По официальному ключу верны варианты 1,2,3,4,5,6,7 — все содержат верные объяснения. <b>Ответ: 1234567</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква И.',text:'Н..(1) человек, н..(2) животное, н..(3) нас..(4)комое — н..(5)кто уже больше н..(6) бор..(7)тся со зноем. Одна стр..(8)коза чувствует себя как н..(9) в чём не бывало.',ans:'12356',exp:'<b>1,2,3</b> — отрицательные местоимения «ни человек, ни животное, ни насекомое». <b>5)</b> «нИкто» — НИ безударная. <b>6)</b> «нИ борется» — частица НИ. <b>4)</b> насЕкомое — Е. <b>7)</b> борЕтся — Е (I спр.). <b>8)</b> стрЕкоза — Е. <b>9)</b> «как нИ в чём не бывало» — НИ ✓. <b>Ответ: 12356</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «сплетня» в соответствующей форме.',text:'Никогда не слушайте слухов и (сплетня)!',ans:'сплетен',exp:'Р.п. мн.ч.: <b>сплетен</b> (беглая Е). Ответ: сплетен'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «мёд с крупинками» (управление) синонимичным со связью согласование.',ans:'крупинчатый мёд',exp:'Управление → согласование: <b>крупинчатый мёд</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) Мама открыла Андрею красоту окружающего мира.','2) История о капитане Скотте сильно впечатлила Андрея.','3) Андрей спас капитана Скотта и его команду.','4) Даже взрослым Андрей продолжал жить с мамой.','5) Воспоминания о маме помогали Андрею в трудные минуты.'],ans:[1,2],exp:'<b>1)</b> «Всё в мире открывала Андрею мать» ✓. <b>2)</b> История о капитане Скотте впечатлила Андрея ✓. <b>Ответ: 12</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является олицетворение. Запишите номера ответов.',opts:['1) Комнаты были прохладные, а в раскрытые окна бежал ветер.','2) Каждая новая весна несла ему незабываемые запахи детства.','3) Всё в мире открывала Андрею мать.','4) Берёзовые листья как золотые пятаки на снегу.','5) Он не мог рассказать, как она воспитывала его.'],ans:[1,2],exp:'<b>1)</b> «бежал ветер» — олицетворение ✓. <b>2)</b> «весна несла» — олицетворение ✓. <b>4)</b> «как золотые пятаки» — сравнение. <b>Ответ: 12</b>'},
{id:'12',type:'i',inputType:'word',task:'В предложениях 46–52 найдите синоним к слову «храбрый». Выпишите это слово.',ans:'смелый',exp:'Синоним к «храбрый»: <b>смелый</b>. Ответ: смелый'},
]},
];

// STATE
let cur=0;
const ST=JSON.parse(localStorage.getItem('oge_ru1')||'{}');
function sv(){localStorage.setItem('oge_ru1',JSON.stringify(ST));}
function sk(vn,qid,s){return `v${vn}_${qid}_${s}`;}

function gsc(v){
  const t=v.qs.length;let d=0;
  v.qs.forEach(q=>{if(ST[sk(v.n,q.id,'done')])d++;});
  return{t,d};
}

function buildGrid(){
  const g=document.getElementById('vg');g.innerHTML='';
  V.forEach((v,i)=>{
    const s=gsc(v);
    const b=document.createElement('div');
    b.className='vbtn'+(i===cur?' active':'')+(s.d===s.t?' done':'');
    b.innerHTML=`<div class="vn">${v.n}</div><div class="vsc">${s.d}/${s.t}</div>`;
    b.onclick=()=>selVar(i);g.appendChild(b);
  });
}

function buildAll(){
  const c=document.getElementById('vcs');c.innerHTML='';
  V.forEach((v,vi)=>{
    const d=document.createElement('div');
    d.className='vc'+(vi===0?' active':'');d.id=`vc${vi}`;
    d.innerHTML=buildV(v);c.appendChild(d);
  });
}

function fmt(t){
  return t.replace(/\n/g,'<br>').replace(/\((\d+)\)/g,'<span class="sn">($1)</span>');
}

function buildV(v){
  let h=`<div class="sec-lbl" style="color:var(--p)">Текст 1 · Задания 2–9</div>`;
  h+=`<div class="txt-box" id="t1_${v.n}">${fmt(v.t1)}</div>`;
  h+=`<div class="txt-more" onclick="xpnd('t1_${v.n}',this)">▼ Читать полностью</div>`;
  v.qs.filter(q=>['2','3','4','5','6','7','8','9'].includes(q.id)).forEach(q=>h+=bQ(v.n,q));
  h+=`<div class="sec-lbl" style="color:var(--g)">Текст 2 · Задания 10–12</div>`;
  h+=`<div class="txt-box" id="t2_${v.n}" style="border-left-color:var(--g)">${fmt(v.t2)}</div>`;
  h+=`<div class="txt-more" onclick="xpnd('t2_${v.n}',this)">▼ Читать полностью</div>`;
  v.qs.filter(q=>['10','11','12'].includes(q.id)).forEach(q=>h+=bQ(v.n,q));
  const s=gsc(v);
  h+=`<div class="sc"><div class="scn">${s.d}/${s.t}</div><div><div class="scl">Выполнено заданий</div><div class="sct">Ответь на все и переходи к следующему</div></div></div>`;
  return h;
}

function bQ(vn,q){
  const done=ST[sk(vn,q.id,'done')];
  let h=`<div class="qw" id="qw_${vn}_${q.id}"><div class="qn">Задание ${q.id}</div><div class="qt">${q.task}</div>`;
  if(q.type==='m') h+=bM(vn,q,done);
  else if(q.type==='match') h+=bMt(vn,q,done);
  else h+=bI(vn,q,done);
  if(!done) h+=`<button class="chkbtn" onclick="chk(${vn},'${q.id}')">Проверить</button>`;
  const ok=ST[sk(vn,q.id,'ok')];
  h+=`<div class="fb${done?' show '+(ok?'ok':'err'):''}" id="fb_${vn}_${q.id}">`;
  if(done) h+=`<div class="fbl">${ok?'✅ Верно!':'❌ Неверно'}</div>${q.exp}`;
  h+=`</div></div>`;
  return h;
}

function bM(vn,q,done){
  const sel=ST[sk(vn,q.id,'sel')]?JSON.parse(ST[sk(vn,q.id,'sel')]):[];
  let h=`<div class="chkopts" id="o_${vn}_${q.id}">`;
  q.opts.forEach((o,i)=>{
    const n=i+1,isSel=sel.includes(n),isAns=q.ans.includes(n);
    let cl='cho'+(isSel?' sel':'');
    if(done){cl='cho disabled';if(isSel&&isAns)cl+=' correct';else if(isSel&&!isAns)cl+=' wrong';else if(!isSel&&isAns)cl+=' missed';}
    h+=`<div class="${cl}" onclick="tog(${vn},'${q.id}',${n})"><div class="cb">${isSel?'✓':''}</div><span>${o}</span></div>`;
  });
  return h+`</div><div style="font-size:11px;color:var(--m);margin-bottom:6px">${done?'':'Выберите все верные варианты'}</div>`;
}

function bMt(vn,q,done){
  const sv2=ST[sk(vn,q.id,'sel')]?JSON.parse(ST[sk(vn,q.id,'sel')]):{};
  let h=`<div class="mcols"><div class="mcol ml"><div class="mct">Правила</div>`;
  q.left.forEach((l,i)=>h+=`<div class="mi">${String.fromCharCode(65+i)}) ${l}</div>`);
  h+=`</div><div class="mcol mr"><div class="mct">Предложения</div>`;
  q.right.forEach((r,i)=>h+=`<div class="mi">${i+1}) ${r}</div>`);
  h+=`</div></div><div class="mrow">`;
  ['A','B','C'].forEach((k,ki)=>{
    const rv=sv2[k]||'',cor=q.ans[k];
    let cl='msel';if(done)cl+=rv===cor?' ok':' err';
    h+=`<div class="mc"><div class="mclbl">${String.fromCharCode(65+ki)}</div>
    <select class="${cl}" id="ms_${vn}_${q.id}_${k}" onchange="svm(${vn},'${q.id}')" ${done?'disabled':''}>
    <option value="">—</option>${q.right.map((_,i)=>`<option value="${i+1}"${rv==i+1?' selected':''}>${i+1}</option>`).join('')}
    </select></div>`;
  });
  return h+`</div>`;
}

function bI(vn,q,done){
  const val=ST[sk(vn,q.id,'val')]||'';
  const ok=ST[sk(vn,q.id,'ok')];
  let cl='ai'+(done?ok?' ok':' err':'');
  let h='';
  if(q.text) h+=`<div class="itxt">${q.text}</div>`;
  h+=`<div class="ai-wrap"><input class="${cl}" id="ai_${vn}_${q.id}" type="text" placeholder="Введите ответ..." value="${val}" ${done?'readonly':''} oninput="svi(${vn},'${q.id}',this.value)"></div>`;
  if(done&&!ok) h+=`<div class="ans-hint">Правильный ответ: <b>${q.ans}</b></div>`;
  return h;
}

function tog(vn,qid,n){
  if(ST[sk(vn,qid,'done')]) return;
  const k=sk(vn,qid,'sel');
  let s=ST[k]?JSON.parse(ST[k]):[];
  s=s.includes(n)?s.filter(x=>x!==n):[...s,n];
  ST[k]=JSON.stringify(s);sv();
  const opts=document.querySelectorAll(`#o_${vn}_${qid} .cho`);
  opts.forEach((el,i)=>{
    const isSel=s.includes(i+1);
    el.classList.toggle('sel',isSel);
    el.querySelector('.cb').textContent=isSel?'✓':'';
  });
}

function svm(vn,qid){
  const d={};['A','B','C'].forEach(k=>{const el=document.getElementById(`ms_${vn}_${qid}_${k}`);if(el)d[k]=el.value;});
  ST[sk(vn,qid,'sel')]=JSON.stringify(d);sv();
}

function svi(vn,qid,val){ST[sk(vn,qid,'val')]=val;sv();}

function chk(vn,qid){
  const v=V.find(x=>x.n===vn),q=v.qs.find(x=>x.id===qid);
  let ok=false;
  if(q.type==='m'){
    const sel=ST[sk(vn,qid,'sel')]?JSON.parse(ST[sk(vn,qid,'sel')]):[];
    ok=[...sel].sort().join('')===[...q.ans].sort().join('');
    document.querySelectorAll(`#o_${vn}_${qid} .cho`).forEach((el,i)=>{
      const n=i+1,isSel=sel.includes(n),isAns=q.ans.includes(n);
      el.classList.add('disabled');
      if(isSel&&isAns)el.classList.add('correct');
      else if(isSel&&!isAns)el.classList.add('wrong');
      else if(!isSel&&isAns)el.classList.add('missed');
    });
  } else if(q.type==='match'){
    const sv2=ST[sk(vn,qid,'sel')]?JSON.parse(ST[sk(vn,qid,'sel')]):{};
    ok=sv2['A']===q.ans['A']&&sv2['B']===q.ans['B']&&sv2['C']===q.ans['C'];
    ['A','B','C'].forEach(k=>{const el=document.getElementById(`ms_${vn}_${qid}_${k}`);if(el){el.disabled=true;el.classList.add(sv2[k]===q.ans[k]?'ok':'err');}});
  } else {
    const val=(ST[sk(vn,qid,'val')]||'').trim().toLowerCase();
    const ans=q.ans.toLowerCase();
    ok=val===ans||ans.split(' ').some(a=>val===a)||val.replace(/\s+/g,' ')===ans;
    const el=document.getElementById(`ai_${vn}_${qid}`);
    if(el){el.readOnly=true;el.classList.add(ok?'ok':'err');}
    if(!ok){
      const d=document.createElement('div');d.className='ans-hint';
      d.innerHTML=`Правильный ответ: <b>${q.ans}</b>`;
      el.parentNode.insertAdjacentElement('afterend',d);
    }
  }
  ST[sk(vn,qid,'done')]='1';ST[sk(vn,qid,'ok')]=ok?'1':'';sv();
  const btn=document.querySelector(`#qw_${vn}_${qid} .chkbtn`);if(btn)btn.remove();
  const fb=document.getElementById(`fb_${vn}_${qid}`);
  if(fb){fb.className=`fb show ${ok?'ok':'err'}`;fb.innerHTML=`<div class="fbl">${ok?'✅ Верно!':'❌ Неверно'}</div>${q.exp}`;}
  buildGrid();updP();
  toast(ok?'✅ Правильно!':'❌ Неверно — читай объяснение');
}

function xpnd(id,btn){
  const el=document.getElementById(id);el.classList.toggle('exp');
  btn.textContent=el.classList.contains('exp')?'▲ Свернуть':'▼ Читать полностью';
}

function selVar(i){
  cur=i;
  document.querySelectorAll('.vbtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.vc').forEach((c,j)=>c.classList.toggle('active',j===i));
  document.getElementById('bInfo').textContent=`Вариант ${i+1} из ${V.length}`;
  document.getElementById('bPrev').disabled=i===0;
  document.getElementById('bNext').disabled=i===V.length-1;
  window.scrollTo(0,0);
}

function nav(d){const n=cur+d;if(n>=0&&n<V.length)selVar(n);}

function updP(){
  let t=0,d=0;
  V.forEach(v=>{t+=v.qs.length;v.qs.forEach(q=>{if(ST[sk(v.n,q.id,'done')])d++;});});
  const p=Math.round(d/t*100);
  document.getElementById('ovrV').textContent=p+'%';
  document.getElementById('ovrF').style.width=p+'%';
}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

buildAll();buildGrid();updP();
</script>
</body>
</html>
