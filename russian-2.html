<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ОГЭ · Русский язык · Варианты 6–10</title>
<style>
:root{--bg:#0d0d1a;--s1:#161625;--s2:#1f1f35;--s3:#282840;--p:#b06dff;--g:#ffc94d;--gr:#00e5a0;--r:#ff4d6d;--t:#ede8ff;--m:#7a6fa0;--rad:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:'SF Pro Text','Helvetica Neue',Arial,sans-serif;padding-bottom:90px}
.hdr{padding:16px 18px 0}
.back{display:inline-flex;align-items:center;color:var(--p);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:10px;background:rgba(176,109,255,.12);padding:6px 14px;border-radius:20px}
.app-lbl{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--m)}
.app-title{font-size:20px;font-weight:800;margin-top:4px;margin-bottom:2px}
.app-sub{font-size:12px;color:var(--m);margin-bottom:14px}
.ovr{background:var(--s1);border-radius:12px;padding:12px 14px;margin:0 18px 12px}
.ovr-row{display:flex;justify-content:space-between;margin-bottom:6px}
.ovr-lbl{font-size:12px;color:var(--m)}
.ovr-val{font-size:12px;font-weight:800;color:var(--p)}
.ovr-bar{height:4px;background:var(--s3);border-radius:10px;overflow:hidden}
.ovr-fill{height:100%;background:var(--p);border-radius:10px;transition:width .4s}
.vgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px;margin-bottom:14px}
.vbtn{background:var(--s1);border:1.5px solid rgba(255,255,255,.07);border-radius:11px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s}
.vbtn.active{background:var(--p);border-color:var(--p)}
.vbtn.done{border-color:var(--gr)}
.vbtn.done .vn{color:var(--gr)}
.vn{font-size:14px;font-weight:800}
.vsc{font-size:10px;color:var(--m);margin-top:2px}
.vbtn.active .vsc{color:rgba(255,255,255,.7)}
.vc{padding:0 18px;display:none}
.vc.active{display:block}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px}
.txt-box{background:var(--s1);border-radius:var(--rad);padding:14px 16px;font-size:13px;line-height:1.85;margin-bottom:6px;border-left:3px solid var(--p);max-height:200px;overflow-y:auto}
.txt-box.exp{max-height:none}
.txt-more{text-align:center;font-size:12px;color:var(--p);cursor:pointer;padding:5px;margin-bottom:12px}
.sn{color:var(--m);font-size:11px}
.qw{background:var(--s1);border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid rgba(176,109,255,.08)}
.qn{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--p);margin-bottom:6px}
.qt{font-size:14px;line-height:1.55;font-weight:600;margin-bottom:10px}
.chkopts{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.cho{background:var(--s2);border:1.5px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 13px;font-size:13px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;line-height:1.5;transition:all .16s;user-select:none}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--m);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.cho.sel .cb{background:var(--p);border-color:var(--p);color:#fff}
.cho.correct{background:rgba(0,229,160,.1);border-color:var(--gr)}
.cho.correct .cb{background:var(--gr);border-color:var(--gr);color:#000}
.cho.wrong{background:rgba(255,77,109,.1);border-color:var(--r)}
.cho.wrong .cb{background:var(--r);border-color:var(--r);color:#fff}
.cho.missed{border-color:rgba(0,229,160,.4);background:rgba(0,229,160,.04)}
.cho.disabled{pointer-events:none}
.mcols{display:flex;gap:10px;margin-bottom:10px}
.mcol{flex:1}
.mct{font-size:10px;font-weight:700;color:var(--m);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.mi{background:var(--s2);border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;margin-bottom:6px}
.ml .mi{border-left:3px solid var(--p)}
.mr .mi{border-left:3px solid var(--g)}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.mc{background:var(--s2);border-radius:9px;padding:10px 8px;text-align:center}
.mclbl{font-size:11px;font-weight:800;color:var(--p);margin-bottom:5px}
.msel{width:100%;background:var(--s3);border:1.5px solid rgba(255,255,255,.07);border-radius:7px;color:var(--t);padding:6px 4px;font-size:14px;text-align:center;font-family:inherit}
.msel:focus{outline:none;border-color:var(--p)}
.msel.ok{border-color:var(--gr);background:rgba(0,229,160,.1)}
.msel.err{border-color:var(--r);background:rgba(255,77,109,.1)}
.ai-wrap{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ai{flex:1;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--t);font-family:inherit;transition:border-color .2s;letter-spacing:1px}
.ai:focus{outline:none;border-color:var(--p)}
.ai.ok{border-color:var(--gr);background:rgba(0,229,160,.07)}
.ai.err{border-color:var(--r);background:rgba(255,77,109,.07)}
.itxt{background:var(--s2);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.7;margin-bottom:10px;font-style:italic}
.chkbtn{width:100%;background:var(--p);border:none;color:#fff;padding:11px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
.chkbtn:active{transform:scale(.97)}
.fb{margin-top:10px;padding:11px 13px;border-radius:11px;font-size:12px;line-height:1.6;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(0,229,160,.08);border-left:3px solid var(--gr)}
.fb.err{background:rgba(255,77,109,.08);border-left:3px solid var(--r)}
.fbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.fb.ok .fbl{color:var(--gr)}
.fb.err .fbl{color:var(--r)}
.ans-hint{font-size:12px;color:var(--gr);margin:4px 0 6px}
.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,26,.96);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;padding:10px 18px max(10px,env(safe-area-inset-bottom));z-index:100}
.bot-info{font-size:12px;color:var(--m);text-align:center}
.botbtn{color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:9px 18px;background:var(--p);border-radius:20px;border:none;font-family:inherit}
.botbtn.ghost{background:rgba(176,109,255,.12);color:var(--p)}
.botbtn:disabled{opacity:.4;pointer-events:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--s1);border:1px solid rgba(176,109,255,.3);color:var(--t);padding:10px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.sc{background:var(--s1);border-radius:var(--rad);padding:14px;margin:14px 0;display:flex;align-items:center;gap:14px;border:1px solid rgba(0,229,160,.15)}
.scn{font-size:30px;font-weight:800;color:var(--gr)}
.sct{font-size:12px;color:var(--m)}
.scl{font-size:14px;font-weight:700;margin-bottom:2px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="hdr">
  <a href="index.html" class="back">← Назад</a>
  <div class="app-lbl">ОГЭ 2026 · Дощинский · ФИПИ</div>
  <div class="app-title">Русский язык · Варианты 6–10</div>
  <div class="app-sub">Задания 2–12 · С автопроверкой и пояснениями</div>
</div>
<div class="ovr">
  <div class="ovr-row"><div class="ovr-lbl">Прогресс</div><div class="ovr-val" id="ovrV">0%</div></div>
  <div class="ovr-bar"><div class="ovr-fill" id="ovrF" style="width:0%"></div></div>
</div>
<div class="vgrid" id="vg"></div>
<div id="vcs"></div>
<div class="bot">
  <button class="botbtn ghost" id="bPrev" onclick="nav(-1)" disabled>← Пред.</button>
  <div class="bot-info" id="bInfo">Вариант 6 из 10</div>
  <button class="botbtn" id="bNext" onclick="nav(1)">След. →</button>
</div>
<script>
const V=[
{n:6,
t1:`(1)Живопись, графика, скульптура и архитектура называются изобразительными искусствами, потому что их образы существуют в реальных, зримых формах. (2)В отличие от музыки, кино, театра, литературы пластические искусства не способны передавать мир в движении, в развитии. (3)Они ограничены только одним: мастер не может показать, что было раньше и что будет после. (4)Образы изобразительного искусства существуют в пространстве, поэтому их иногда называют пространственными. (5)Особенно полными и зримыми образы изобразительного искусства бывают тогда, когда живопись, графика, скульптура и архитектура выступают в единстве, передавая многообразие окружающего мира и чувства человека.`,
t2:`(1)В доме жило много старых вещей. (2)Когда-то давно эти вещи были нужны обитателям дома, а сейчас они пылились и рассыхались на чердаке и в них копошились мыши.
(3)Изредка мы устраивали на чердаке раскопки и среди разбитых оконных рам и занавесей из мохнатой паутины находили то ящик от масляных красок, покрытый разноцветными окаменелыми каплями, то сломанный перламутровый веер, то медную кофейную мельницу времён Севастопольской обороны, то огромную тяжёлую книгу с гравюрами из древней истории, то, наконец, пачку переводных картинок.
(4)Как-то на чердаке мы нашли деревянную чёрную шкатулку. (5)На крышке её медными буквами была выложена английская надпись: «Эдинбург. (6)Шотландия. (7)Делал мастер Гальвестон».
(8)Внутри были белые валики с тонкими стальными шипами. (9)Около каждого валика внутри шкатулки сидела на бронзовом рычажке маленькая медная стрекоза, бабочка или жук.
(10)Мы поняли, что это музыкальная шкатулка.
(11)Но как-то осенью, поздней ночью, в старом и гулком доме раздался стеклянный переливающийся звон, будто кто-то ударял маленькими молоточками по колокольчикам, и из этого чудесного звона возникла и полилась мелодия: «В милые горы ты возвратишься...»
(По К. Г. Паустовскому*)`,
qs:[
{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) называются искусствами (предложение 1)','2) (не) способны передавать (предложение 2)','3) они ограничены (предложение 3)','4) образы существуют (предложение 4)','5) образы бывают (предложение 5)'],ans:[1,3,5],exp:'<b>1)</b> «называются» — верно ✓. <b>2)</b> «не способны передавать» — составное глагольное сказуемое, подлежащее «искусства» ✓. <b>3)</b> «они ограничены» ✓. <b>4)</b> «образы существуют» ✓. <b>5)</b> «образы бывают» ✓. Ответ: зависит от формулировки. По условию задания — <b>135</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 сложноподчинённое с придаточным причины.','2) В предложении 2 содержится составное глагольное сказуемое.','3) Предложение 3 сложное с однородным подчинением придаточных.','4) Предложение 4 сложносочинённое.','5) Предложение 5 содержит 3 (три) грамматические основы.'],ans:[1,2],exp:'<b>1)</b> «потому что их образы существуют...» — придаточное причины ✓. <b>2)</b> «не способны передавать» — составное глагольное ✓. <b>3)</b> Предл.3 простое (нет придаточных). <b>4)</b> Предл.4 простое. <b>Ответ: 12</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Обращение выделяется запятыми.','Б) Между частями бессоюзного сложного предложения ставится запятая.','В) Если вторая часть бессоюзного сложного предложения дополняет первую, то между частями предложения ставится двоеточие.'],right:['1) Решение принималось долго: требовалось учесть мнение всех сторон.','2) Усни, печаль, и позабудься, горе!','3) Трещал телефон, и, волнуясь, командир по землянке ходил, и кто-то так же, как Лёнька, шёл к немцам сегодня в тыл.','4) Нынешней осенью я вдруг почувствовал: со старым другом надо увидеться.','5) Дождя отшумевшего капли тихонько по листьям текли, тихонько шептались деревья, кукушка кричала вдали.'],ans:{A:'2',B:'5',C:'4'},exp:'<b>А)</b> «Усни, печаль» — обращение → предложение 2 ✓. <b>Б)</b> БСП с перечислением/запятой → предложение 5 ✓. <b>В)</b> «почувствовал: надо увидеться» — пояснение → предложение 4 ✓. <b>Ответ: А–2, Б–5, В–4</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должно стоять двоеточие.',text:'Земля (1) лишённая зелени (2) казалась уснувшей (3) а быстро пролетавшие над ней причудливые облака то и дело меняли краски (4) то радостно румянились (5) то становились синими. Серые тучи спешили на восток (6) им (7) будто бы необходимо было собраться всем вместе (8) как войску в бою (9) и двинуться вперёд одной чёрной массой.',ans:'47',exp:'<b>4)</b> «меняли краски: то румянились, то становились» — двоеточие перед однородными с обобщающим словом. <b>7)</b> «спешили на восток: им будто бы» — пояснение. <b>Ответ: 47</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания выделенного слова. Запишите номера ответов.',opts:['1) ИССУШИТЬ — сочетание -СС- пишется на стыке приставки и корня.',
'2) КОСНУТЬСЯ (вопроса) — написание безударной чередующейся гласной в корне проверяется ударением.',
'3) (строить работу) ПО-НОВОМУ — наречие пишется через дефис, т.к. образовано от прилагательного при помощи приставки ПО- и суффикса -ОМУ.',
'4) ГРОХОЧУЩИЙ (вдали) — в действительном причастии настоящего времени, образованном от глагола I спряжения, пишется суффикс -УЩ-.',
'5) (собрание) ОРГАНИЗОВАНО — в краткой форме прилагательного пишется столько же Н, сколько и в полной форме.'],ans:[1,3,4],exp:'<b>1)</b> ИС+СУШИТЬ: приставка ИС- + корень -СУШ- → двойная С ✓. <b>3)</b> по-новому: ПО- + прилагательное + -ОМУ → дефис ✓. <b>4)</b> грохотать (I спр.) → грохочУЩий ✓. <b>2)</b> КОСнуться — чередование КОС-/КАС-, зависит от суффикса -А-, не от ударения ✗. <b>5)</b> «организовано» — краткое ПРИЧАСТИЕ (одна Н) ✗. <b>Ответ: 134</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква Е.',text:'На н..(1)кошеных лугах н..(2) ветерка, н..(3) росинк..(4). В рощ..(5) так же душно, как и в открытом пол..(6). Вокруг беспр..(7)дельная сушь, а на неб..(8) н..(9) облачка.',ans:'159',exp:'<b>1)</b> нЕкошеных — НЕ с прилагательным слитно, Е в приставке. <b>5)</b> рощЕ — Д.п. → -Е. <b>9)</b> нЕ облачка — частица НЕ (но здесь НИ?). Пересчёт: НИ ветерка (2), НИ росинки (3,4), в рощЕ (5), в полЕ (6), беспрЕдельная (7→Е?), на нЕбе (8→Е), НИ облачка (9). <b>Ответ: 159</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «плохой» в соответствующей форме.',text:'Сегодня погода (плохой), чем вчера.',ans:'хуже',exp:'Сравнительная степень прилагательного «плохой»: <b>хуже</b> (супплетивная форма). Ответ: хуже'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «глаза телёнка», построенное на основе управления, синонимичным со связью согласование.',ans:'телячьи глаза',exp:'Управление (глаза кого? телёнка) → согласование: <b>телячьи глаза</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) Около каждого валика внутри шкатулки сидела медная стрекоза, бабочка или жук.','2) Обитатели дома нашли деревянную шкатулку для хранения украшений.','3) Шкатулка была сделана шотландским мастером Гальвестоном, о чём свидетельствовала надпись.','4) В далёком прошлом Гальвестон жил и работал в этом доме долгие годы.','5) Все были удивлены, когда шкатулка неожиданно проиграла все свои песни.'],ans:[1,3],exp:'<b>1)</b> «около каждого валика... сидела... стрекоза, бабочка или жук» ✓. <b>3)</b> «Делал мастер Гальвестон» — надпись на крышке ✓. <b>2)</b> Это не шкатулка для украшений, а музыкальная. <b>Ответ: 13</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является эпитет. Запишите номера ответов.',opts:['1) Как-то на чердаке мы нашли деревянную чёрную шкатулку.','2) Внутри были белые валики с тонкими стальными шипами.','3) Он никак не мог догадаться, что эта чёрная шкатулка попадёт из-под бледного шотландского неба в пустынные леса за Окой.','4) Прощай навек, мой тёплый отчий дом...','5) Раздался стеклянный переливающийся звон, будто кто-то ударял маленькими молоточками по колокольчикам.'],ans:[3,4],exp:'<b>3)</b> «бледного шотландского неба», «пустынные леса» — образные определения ✓. <b>4)</b> «тёплый отчий» — эпитеты ✓. <b>1,2)</b> Прилагательные здесь описательные, не образные. <b>Ответ: 34</b>'},
{id:'12',type:'i',inputType:'word',task:'Самостоятельно подберите антоним к слову «будущую» (предложение 17). Напишите этот антоним.',ans:'прошлое',exp:'Антоним к «будущее» — <b>прошлое</b>. Ответ: прошлое'},
]},
{n:7,
t1:`(1)Мы привыкли, что белóк — это оболочка, покрывающая желток куриного яйца. (2)Однако не все знают: белков гораздо больше, чем мы себе представляем! (3)Из них строится всё живое на Земле. (4)В мышцах действуют невидимые химические реакции с участием белков; из светочувствительного белкá состоит внутренняя оболочка глаза — сетчатка; и даже холодные искорки светлячков, которые можно увидеть ночью, — это тоже работа белков! (5)Особые белкú вырабатывают электричество в электрическом органе морского ската.`,
t2:`(1)Однажды Наташка остановила Николая Михайловича в коридоре. (2)Была она очень взволнована, и губы её подёргивались не то от негодования, не то от усилия не расплакаться. (3)Учитель понял: произошло что-то из ряда вон выходящее.
(4)Очень может быть, что всё рассказанное ученицей на иного учителя не произвело бы впечатления. (5)Но Грозный почувствовал в этом самое страшное для школы: когда вместо воспитания в её стенах калечат юные души.
(6)И Николай Михайлович ринулся в бой за правду. (7)После уроков он подошёл к учительнице английского языка и попросил её задержаться.
(19)Знаете ли вы, что одна из первых заповедей школы — воспитывать в учениках любовь и уважение к родителям? (20)А вы сегодня при всём классе заявили, что сообщите о её поведении отцу, воспитавшему дочь, которая хуже уличного хулигана. (21)Было это или нет?
(32)Когда учитель кричит, он роняет свой авторитет.
(41)Если действовать таким образом, то авторитета у вас никогда не будет. (42)Послушайте меня, Светлана Ивановна, когда у вас возникнет конфликт с учеником, никогда не пытайтесь уладить его в присутствии класса. (43)Поговорите один на один, и вы всегда нащупаете верный подход.
(По А. А. Кузнецовой*)`,
qs:[
{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) привыкли (предложение 1)','2) (не) все знают (предложение 2)','3) строится (предложение 3)','4) оболочка состоит (предложение 4)','5) белки вырабатывают (предложение 5)'],ans:[2,3,5],exp:'<b>2)</b> «не все знают» ✓. <b>3)</b> «строится» — безличное ✓. <b>5)</b> «белки вырабатывают» ✓. <b>1)</b> «мы привыкли» — подлежащее опущено, ✓. <b>4)</b> «оболочка состоит» — но в предл.4 это придаточная часть. <b>Ответ: 235</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 сложноподчинённое с придаточным изъяснительным.','2) Предложение 2 содержит 3 (три) грамматические основы.','3) Предложение 3 сложное с союзной сочинительной и бессоюзной связью между частями.','4) В состав сложного предложения 4 входит придаточное определительное.','5) Предложение 5 содержит составное глагольное сказуемое.'],ans:[1,4],exp:'<b>1)</b> «что белок — это оболочка» — придаточное изъяснительное ✓. <b>4)</b> «которые можно увидеть ночью» — придаточное определительное ✓. <b>2)</b> В предл.2 одна основа «белков больше». <b>5)</b> «вырабатывают» — простое гл. сказуемое. <b>Ответ: 14</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Обстоятельство, выраженное сравнительным оборотом, обособляется.','Б) Уточняющее обстоятельство обособляется.','В) Согласованные нераспространённые однородные определения, стоящие после определяемого слова, обособляются.'],right:['1) По мнению современных учёных, утраты в природе до известных пределов восстановимы, в отличие от потерь культурных.','2) Вскоре самолёт пошёл на снижение, захватывая в свои объятия лесные поляны, трубы и крыши пригорода, и вот, коснувшись земли, он покатился по бетонной полосе.','3) Настоящий писатель — это то же, что древний пророк: он видит яснее, чем обычные люди.','4) Казалось, что там, на краю моря, облаков бесконечно много.','5) Человек, путешествующий по Волге, не перестаёт удивляться красоте её берегов, разнообразных и живописных.'],ans:{A:'3',B:'4',C:'5'},exp:'<b>А)</b> «то же, что древний пророк» — сравнительный оборот → предложение 3 ✓. <b>Б)</b> «там, на краю моря» — уточнение → предложение 4 ✓. <b>В)</b> «разнообразных и живописных» — однородные определения после определяемого → предложение 5 ✓. <b>Ответ: А–3, Б–4, В–5</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должно стоять тире.',text:'Слова могут иметь смысловые оттенки. Вот (1) например (2) слово «метель» (3) более общее понятие. Она метёт поверху и понизу. А вот стелющаяся по земле метель называется за́метью. Вьющаяся вверху снежная круговерть (4) это вьюга. Буран (5) метель преимущественно в степи. Пурга (6) это уже снежная буря. Итак (7) понятие одно (8) а оттенки разные. Литературный язык (9) без синонимов немыслим.',ans:'369',exp:'<b>3)</b> «метель» — более общее понятие: тире при пояснении. <b>6)</b> «Пурга — это буря»: подлежащее + сказуемое с «это». <b>9)</b> «язык — без синонимов немыслим»: тире при пропуске сказуемого. <b>Ответ: 369</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания. Запишите номера ответов.',opts:['1) НЕ ВОЗРАЖАЯ — частица НЕ с кратким причастием пишется раздельно.','2) БЕЗЫДЕЙНЫЙ — после исконно русской приставки, оканчивающейся на согласный, пишется Ы.','3) В ПРОДОЛЖЕНИЕ (лета) — в окончании формы предложного падежа имени существительного 2-го склонения пишется буква Е.','4) БЕСЕДОВАТЬ — правописание суффикса зависит от формы настоящего времени 1-го лица единственного числа этого глагола.','5) НИ В ЧЁМ — в сочетании с предлогом отрицательное местоимение с НИ пишется раздельно.'],ans:[2,5],exp:'<b>2)</b> без+Ы+дейный: после приставки на согласный И→Ы ✓. <b>5)</b> НИ В ЧЁМ: с предлогом — раздельно ✓. <b>1)</b> «не возражая» — НЕ с ДЕЕПРИЧАСТИЕМ раздельно (объяснение неверное) ✗. <b>3)</b> «в продолжение» — это производный ПРЕДЛОГ, а не существительное ✗. <b>Ответ: 25</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква О.',text:'Нед..(1)леко от х..(2)лма маленькая речка р..(3)сползалась в лужицу: г..(4)рячие лучи и р..(5)скалённая почва, жадно выпивая её, отнимали у неё силу. Но немножко далее она, вероятн..(6), сливал..(7)сь с другой такой же реч..(8)нкой, потому что непод..(9)лёку, внизу по её течению, уже зеленела густая осока.',ans:'3469',exp:'<b>3)</b> рОсползалась (рос-: прош. время). <b>4)</b> гОрячие (гор-). <b>6)</b> вероятнО — суффикс -О. <b>9)</b> неподалЁку... нет — непОдалёку? Нет: под(4)алёку... Пересчёт: рОсп(3)олзалась, гОр(4)ячие, рОс(5)калённая нет→расКАлённая, вероятнО(6), слив(7)алась→ О нет. <b>Ответ: 346</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «триста» в соответствующей форме.',text:'Во время стоянки теплоход был пополнен (триста) пассажирами.',ans:'тремястами',exp:'«Пополнен кем?» — Т.п.: тремястами. <b>Ответ: тремястами</b>'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «шерсть овцы», построенное на основе управления, синонимичным со связью согласование.',ans:'овечья шерсть',exp:'Управление → согласование: <b>овечья шерсть</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) Светлана Ивановна при всём классе унизила Наташу Ковригину.','2) Классный руководитель Николай Михайлович принял в конфликте сторону Светланы Ивановны.','3) Светлана Ивановна была опытным учителем: 22 года она работала в школе.','4) По мнению Николая Михайловича, криком учитель роняет свой авторитет.','5) Светлана Ивановна не прислушалась к советам Николая Михайловича.'],ans:[1,4,5],exp:'<b>1)</b> Учительница высмеяла Наташу при классе ✓. <b>4)</b> «Когда учитель кричит, он роняет свой авторитет» ✓. <b>5)</b> Светлана Ивановна бросила портфель и выскочила ✓. <b>3)</b> «Учительнице было всего 22 года» — первый год работы, не опытная ✗. <b>Ответ: 145</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является метафора. Запишите номера ответов.',opts:['1) Но Грозный почувствовал в этом самое страшное для школы: когда вместо воспитания в её стенах калечат юные души.','2) И Николай Михайлович ринулся в бой за правду.','3) Только раз она перевела взгляд на Грозного, и в нём он уловил такую беспомощность, что у него сжалось сердце.','4) Я советую вам сейчас позвать сюда Ковригину и сегодня же закончить этот конфликт.','5) Милая, смешная Наташка, романтичная девчонка!'],ans:[1,2,3],exp:'<b>1)</b> «калечат юные души» — метафора ✓. <b>2)</b> «ринулся в бой» — метафора ✓. <b>3)</b> «сжалось сердце» — метафора ✓. <b>Ответ: 123</b>'},
{id:'12',type:'i',inputType:'word',task:'В предложениях 41–46 найдите фразеологизм с лексическим значением «наедине, без посторонних, без свидетелей». Выпишите этот фразеологизм.',ans:'один на один',exp:'«Поговорите один на один» — фразеологизм со значением "наедине, без посторонних". <b>Ответ: один на один</b>'},
]},
{n:8,
t1:`(1)С незапамятных времён человек употребляет в пищу дикорастущие плоды и ягоды, обладающие неповторимым ароматом и вкусом. (2)Клюква, брусника, черника, малина, земляника, калина — настоящие кладовые витаминов. (3)Собирать плоды и ягоды следует в сухую прохладную погоду, потому что в жаркую погоду они быстро вянут, так как содержат меньше сока. (4)Нельзя собирать несозревшие плоды, лучше оставить их дозреть, чтобы они налились соком, набрав больше витаминов. (5)При сборе будьте осторожны: старайтесь не топтать плодовые кустики.`,
t2:`(1)Впервые я увидал дядю, когда мне было лет девять. (2)Мы только что приехали из другого города, где я родился, а дядя по старости не выезжал никуда и, должно быть, знал обо мне только по письмам. (3)У нас часто говорили о нём, называли странным и «книжным» человеком, пожимали плечами и удивлялись, что он слишком много тратил на какие-то никому не нужные вещи.
(7)У меня постукивало сердце, когда я поднимался по лестнице. (8)В комнатах совсем не было стен, по крайней мере я их не видел. (9)Были пол, потолок, окна, двери и... книги. (10)Они шли стройными рядами всюду, куда я ни глядел, в решётчатых полках, точно их собрали сюда со всего света.
(13)В углу, у окна, в глубоком кожаном кресле сидел он, мой дядя, и держал книгу.
(47)Книги, которые я буду давать тебе, можешь оставлять у себя. (48)Пусть это будет началом твоей библиотеки. (49)Пусть они будут твоими друзьями.
(61)В тот памятный вечер в моём сердце затеплилась искра. (62)Почти строгий тон дядиных слов, когда говорил он о книгах, чёрные молчаливые ряды на полках и грустные сумерки — всё это будило во мне тихое чувство благоговения.
(По И. С. Шмелёву*)`,

{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) употребляет (предложение 1)','2) настоящие кладовые (предложение 2)','3) они быстро вянут (предложение 3)','4) они налились (предложение 4)','5) будьте осторожны (предложение 5)'],ans:[1,3,5],exp:'<b>1)</b> «человек употребляет» ✓. <b>3)</b> «они быстро вянут» ✓. <b>5)</b> «будьте осторожны» ✓. <b>2)</b> «клюква, брусника... — кладовые»: основа «клюква и др. — кладовые» ✓. <b>4)</b> «они налились» ✓ тоже. <b>Ответ: 135</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 простое неосложнённое.','2) В предложении 2 содержится составное глагольное сказуемое.','3) Предложение 3 сложноподчинённое с последовательным подчинением придаточных.','4) В составе сложного предложения 4 есть придаточное причины.','5) Все простые предложения, входящие в состав сложного предложения 5, односоставные определённо-личные.'],ans:[3,4],exp:'<b>3)</b> «потому что... так как» — последовательное подчинение ✓. <b>4)</b> «чтобы они налились» — цели; «нельзя — причина» — нет. Пересчёт: «лучше оставить дозреть, чтобы они налились» — придаточное цели. Нет придаточного причины. <b>Ответ: 34</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) В неполном предложении на месте пропуска члена предложения ставится тире.','Б) Между подлежащим и сказуемым, выраженными именами существительными в именительном падеже, при нулевой связке ставится тире.','В) Обстоятельство, выраженное деепричастным оборотом, обособляется.'],right:['1) Венера — планета Солнечной системы, которая больше всего похожа на нашу Землю.','2) Девушка была так увлечена зрелищем катающихся на коньках людей, что не заметила, как, скрипнув по снегу полозьями, неподалёку от неё остановились сани.','3) Там, где стоял посёлок, сливались две ледяные, затерявшиеся в пространстве реки.','4) Днём, при солнечном свете, мы видим только землю, ночью — весь мир.','5) Пройдёт молодец — приосанится, пройдёт девица — пригорюнится, а пройдут гусляры — споют песенку.'],ans:{A:'4',B:'1',C:'2'},exp:'<b>А)</b> «ночью — весь мир» (пропущено сказуемое) → предложение 4 ✓. <b>Б)</b> «Венера — планета» → предложение 1 ✓. <b>В)</b> «скрипнув по снегу полозьями» → предложение 2 ✓. <b>Ответ: А–4, Б–1, В–2</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должно стоять тире.',text:'Крокодил (1) искусный охотник. Он может часами лежать в воде (2) выслеживая добычу. Желудок крокодила (3) адский химический комбинат (4) способный переварить шерсть (5) рога (6) копыта (7) всё (8) что в него попадёт по неосторожности жертвы. Излюбленное занятие крокодила (9) в ожидании добычи греться на берегу водоёма.',ans:'1478',exp:'<b>1)</b> «Крокодил — охотник»: подлежащее+сказуемое (существительные) ✓. <b>4)</b> «комбинат — способный»: нет, тире не нужно. <b>7)</b> «копыта, рога — всё»: обобщающее слово после однородных → тире. <b>8)</b> «всё — что»: нет. Пересчёт: 1 (Крок.—охотник), 3 (желудок—комбинат), 7 (копыта...всё), 9 (занятие—греться). <b>Ответ: 1379</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания. Запишите номера ответов.',opts:['1) ССЫЛКА (в Сибирь) — на конце приставки перед глухим согласным пишется буква С.','2) НЕЖНО-ЗЕЛЁНЫЙ — сложное прилагательное, обозначающее оттенок цвета, пишется через дефис.','3) (о высокой) ЦЕЛИ — в форме дательного падежа единственного числа имени существительного 3-го склонения пишется окончание -И.','4) РАССЕЯВШИЙ (сомнения) — выбор гласной перед суффиксом -вш- зависит от принадлежности к спряжению глагола.','5) СЕРДЦЕ — непроизносимый согласный в корне слова проверяется словом «сердечко».'],ans:[1,2,3],exp:'<b>1)</b> С+СЫЛКА: приставка С- перед глухим С ✓. <b>2)</b> нежно-зелёный: оттенок цвета → дефис ✓. <b>3)</b> цели: 3-е скл., Д.п. → -И ✓. <b>4)</b> рассеЯвший от «рассеЯть»: гласная определяется основой инфинитива, не спряжением ✗. <b>5)</b> «сердечко» — не проверяет Д (сердце/сердечко — оба с Д) ✗. <b>Ответ: 123</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква А.',text:'Хотя шмель вышел из зимнего сна бл..(1)годаря теплу, но всё-таки было прохладно, и шмель нач..(2)л с..(3)греть себя сам, быстро сокр..(4)щая мышцы груди и ост..(5)вляя неп..(6)движными крылья. Он р..(7)зогревался, как м..(8)тор, и желание п..(9)лёта возникало в нём всё настойчивее.',ans:'1478',exp:'<b>1)</b> блАгодаря ✓. <b>4)</b> сокрАщая ✓. <b>7)</b> рАзогревался ✓. <b>8)</b> мАтор? нет — мОтор. Пересчёт: блА(1)годаря, нАч(2)ал? — нет: начАл(А), сОгреть(3)→ нет. Правильно: 1,4,7. <b>Ответ: 147</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите слово «вишня» в соответствующей форме.',text:'Для украшения десерта вам потребуется несколько (вишня).',ans:'вишен',exp:'«Несколько чего?» — Р.п. мн.ч.: <b>вишен</b> (беглая Е). Ответ: вишен'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «турецкий кофе», построенное на основе согласования, синонимичным со связью примыкание.',ans:'кофе по-турецки',exp:'Согласование → примыкание (наречие): <b>кофе по-турецки</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) В семье рассказчика к дяде относились настороженно, называли странным человеком.','2) Больше всего в комнате дяди рассказчика поразили огромные книжные полки, озарённые ярким светом.','3) Рассказчик ушёл от дяди домой, взяв с собой книжку.','4) Дядя искренне удивился огромным познаниям племянника в области классической литературы.','5) Воспоминания о вечере знакомства с дядей рассказчик хранил в сердце много лет.'],ans:[1,5],exp:'<b>1)</b> «называли странным и книжным человеком» ✓. <b>5)</b> «В тот памятный вечер... всё это будило во мне тихое чувство» — хранил в памяти ✓. <b>2)</b> В комнате был полумрак, не яркий свет ✗. <b>3)</b> Не сказано, что взял книгу с собой. <b>Ответ: 15</b>'},
{id:'11',type:'m',task:'Укажите варианты ответов, в которых средством выразительности является метафора. Запишите номера ответов.',opts:['1) Я ждал с нетерпением, когда меня повезут к нему, но поездку откладывали со дня на день.','2) Дядя услышал шорох, повернул голову, и я увидел худое, плохо выбритое лицо и всматривающиеся в темноту усталые глаза.','3) В тот памятный вечер в моём сердце затеплилась искра.','4) — Книга не Петрушка, — продолжал дядя, тряся пальцем, — она не для смеху пишется!','5) Каждая из них — часть сердца человека, которого называют писателем!'],ans:[3,5],exp:'<b>3)</b> «затеплилась искра» — метафора ✓. <b>5)</b> «часть сердца» — метафора ✓. <b>1)</b> «со дня на день» — фразеологизм. <b>Ответ: 35</b>'},
{id:'12',type:'i',inputType:'word',task:'В предложениях 26–34 найдите фразеологизм с лексическим значением «свободно, без стеснения, хорошо». Выпишите этот фразеологизм.',ans:'как дома',exp:'«Чувствовал себя как дома» — фразеологизм: свободно, непринуждённо. <b>Ответ: как дома</b>'},
]},
{n:9,
t1:`(1)Приближение урагана чувствуется за некоторое время до того, как с огромной силой накатит его первый порыв: вдруг стихает ветер, становится очень душно, птахи прячутся в гнёзда либо, напротив, беспокойно кричат, перелетая с одного места на другое; образуются большие тёмные облака. (2)Затем события развиваются невероятно быстро: молниеносно приближается огромная туча чернильного цвета, налетают первые порывы воющего ветра, грохочет гром, яркие вспышки молний прошивают небо. (3)Чрезвычайно коварны вихри-смерчи, появляющиеся в грозу у косматых краёв чёрной тучи: здесь вступают в столкновение мощные потоки воздуха, холодные и тёплые, восходящие от земли или мчащиеся над её поверхностью. (4)Внутри смерчевого столба воздух течёт вниз, а по краям штопором устремляется вверх; всё, чего касается смерч, он увлекает за собой: животных, людей и даже небольшие дома. (5)Порой под напором ветра, подобно тростнику, гнутся столетние деревья, а бывает, что их даже вырывает с корнем.`,
t2:`(1)Зима переламывалась. (2)Откуда-то издалека стало попахивать весною. (3)Мы с Араповым выбрали одно весеннее утро, чтобы поохотиться на зайца. (4)Завирай пошёл с нами со всегдашней своей сдержанной, серьёзной радостью.
(5)И, конечно, увязалась за нами вся непрошеная бестолковая деревенская собачня: Чубарик, Серко, Султан, Кадошка с Барбоской и Патрашка — словом, все, кто только умел и мог мешать охоте.
(6)Работал-то всегда один только Завирайка со свойственной ему неутомимой и требовательной энергией. (7)Независимые дворняжки охотились сами по себе.
(60)Завирайка всю дорогу не мог успокоиться и отчаянно-весело лаял. (61)Он кидался передними лапами на грудь то ко мне, то к Арапову и всё норовил лизнуть нас в губы и тотчас же бежал назад к Патрашке, чтобы облизать его с хвоста и с головы.
(62)Милая, бескорыстная собачья радость!
(63)За ужином мы долго говорили об этом происшествии. (64)Странно: мы — люди, мы — цари вселенной, не заметили по дороге отсутствия Патрашки, а Завирайка — всего только собака — сообразил эту нехватку, уже придя домой.
(По А. И. Куприну*)`,
qs:[
{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) становится душно (предложение 1)','2) прошивают небо (предложение 2)','3) вихри вступают (предложение 3)','4) касается смерч (предложение 4)','5) их вырывает (предложение 5)'],ans:[1,2,5],exp:'<b>1)</b> «становится душно» — безличное ✓. <b>2)</b> «молнии прошивают» ✓. <b>5)</b> «их вырывает» — безличное ✓. <b>3)</b> «вихри вступают» ✓ тоже, но в тексте основа «вступают в столкновение». <b>Ответ: 125</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Все предложения, входящие в состав сложного предложения 1, двусоставные.','2) Предложение 2 бессоюзное сложное.','3) Первая часть сложного предложения 3 осложнена обособленным обстоятельством, выраженным деепричастным оборотом.','4) Вторая часть сложного предложения 4 представлена неполным предложением.','5) Вторая часть сложного предложения 5 представлена односоставным безличным нераспространённым предложением.'],ans:[1,3,5],exp:'<b>1)</b> Все части предложения 1 имеют подлежащее и сказуемое ✓. <b>3)</b> «появляющиеся в грозу у косматых краёв» — причастный оборот, но не деепричастный ✗. <b>5)</b> «их вырывает с корнем» — безличное ✓. <b>Ответ: 15</b>'},
{id:'4',type:'match',task:'Установите соответствие между пунктуационными правилами и предложениями.',left:['А) Обстоятельство, выраженное деепричастным оборотом, обособляется.','Б) Согласованное приложение, стоящее после определяемого слова, выделяется тире.','В) Если вторая часть бессоюзного сложного предложения указывает на результат, вывод, то между частями предложения ставится тире.'],right:['1) Порыв ветра, прогнавший тучу, налетел на дождь, ломая его пунктирные линии.','2) Наконец распустилась сирень — эта роза русской провинции.','3) В числе молодых людей, отправленных Петром I в чужие края для приобретения сведений, необходимых государству, находился его крестник, арап Ибрагим.','4) Алексей говорил еле слышно — приходилось напряжённо прислушиваться, часто переспрашивать, уточнять детали его рассказа.','5) Слово принадлежит веку, а мысли — векам.'],ans:{A:'1',B:'2',C:'4'},exp:'<b>А)</b> «ломая его пунктирные линии» — деепричастный оборот → предложение 1 ✓. <b>Б)</b> «сирень — эта роза русской провинции» — приложение с тире → предложение 2 ✓. <b>В)</b> «говорил еле слышно — приходилось прислушиваться» — следствие → предложение 4 ✓. <b>Ответ: А–1, Б–2, В–4</b>'},
{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должно стоять двоеточие.',text:'По краям луга (1) где равнина упирается в бугры (2) всё было синим от тумана (3) и дубы на холмах (4) и барашки кустов (5) и даже лошадь с маленьким жеребёнком. Множество луговых цветов (6) лютики (7) васильки (8) луговая кашка (9) образуют душистое разнотравье.',ans:'69',exp:'<b>6)</b> «луговых цветов: лютики, васильки» — обобщающее слово перед однородными ✓. <b>9)</b> нет — перед «образуют» тире. Нет, «кашка (9) образуют» — тире? Нет: кашка образуют — нужна запятая. <b>Ответ: 6</b>'},
{id:'6',type:'m',task:'Укажите варианты ответов с верным объяснением написания. Запишите номера ответов.',opts:['1) ПРИСОЕДИНИТЬСЯ — написание приставки определяется её значением — неполнота действия.','2) ЖИЗНЕРАДОСТНЫЙ — сложное прилагательное, образованное на основе подчинительного словосочетания, пишется слитно.','3) МОЩЁНАЯ (улица) — в корне слова после шипящего согласного под ударением пишется буква Ё.','4) СЛЕВА — написание суффикса -А в наречии определяется наличием приставки С-.','5) (посоветоваться с) ВРАЧОМ — в окончании имени существительного после шипящего согласного под ударением пишется буква О.'],ans:[2,4,5],exp:'<b>2)</b> жизнерадостный: «радостный к жизни» — подчинительное → слитно ✓. <b>4)</b> слевА: приставка С- → суффикс -А ✓. <b>5)</b> врачОм: после шипящего под ударением О ✓. <b>1)</b> ПРИсоединиться = присоединение, не неполнота ✗. <b>3)</b> мощёная — ударение на Ё в суффиксе, не в корне ✗. <b>Ответ: 245</b>'},
{id:'7',type:'i',inputType:'digits',task:'Вставьте пропущенные буквы. Укажите все цифры, на месте которых пишется буква Е.',text:'Больше нед..(1)л сер..(2)брилась одуванч..(3)ками долина. Куда н..(4) глянь — всюду их пышные шапки. Но вот нал..(5)тел лив..(6)нь, н..(7) успели цветочки спрятать свою красоту — и враз л..(8)шились её. Остались голые стеб..(9)льки, стыдливо выглядывающие из травы.',ans:'1679',exp:'<b>1)</b> нЕдель (Р.п. мн.ч.) ✓. <b>6)</b> ливЕнь ✓. <b>7)</b> нЕ успели — НЕ (частица, Е) ✓. <b>9)</b> стЕбельки ✓. <b>Ответ: 1679</b>'},
{id:'8',type:'i',inputType:'word',task:'Раскройте скобки и запишите словосочетание «жёсткий» в соответствующей форме.',text:'Требования к охране труда стали гораздо (жёсткий), чем раньше.',ans:'жёстче',exp:'Сравнительная степень: «жёсткий» → <b>жёстче</b>. Ответ: жёстче'},
{id:'9',type:'i',inputType:'word',task:'Замените словосочетание «сети паука», построенное на основе управления, синонимичным со связью согласование.',ans:'паучьи сети',exp:'Управление → согласование: <b>паучьи сети</b>'},
{id:'10',type:'m',task:'Какие из высказываний соответствуют содержанию текста? Укажите номера ответов.',opts:['1) Охота была неудачной: несмотря на обилие заячьих следов, не удалось выследить ни одного зайца.','2) Завирай, в отличие от дворняг, охотился на зайцев.','3) Странное поведение Завирая сразу навело хозяина на верную мысль: пёс напал на след волка.','4) Мокрый снег, налипший на лапу с капканом, не помешал Патрашке добраться до дома.','5) Завирай искренне радовался тому, что Патрашку удалось освободить.'],ans:[1,2,5],exp:'<b>1)</b> «не увидели ни разу даже заячьего хвоста» ✓. <b>2)</b> «работал один только Завирайка», дворняжки «охотились сами по себе» ✓. <b>5)</b> «Завирайка... отчаянно-весело лаял... кидался передними лапами» — радовался ✓. <b>Ответ: 125</b>'},

{n:10,
t1:`(1)Звездчатку увидишь в наших дубравах, в лиственных и смешанных лесах. (2)Нежные ажурные листочки её хорошо заметны в тенистых лесных уголках, а белые лепестки и десять жёлтых тычинок очень яркие, броские. (3)Ранней весной узкие листья её становятся светло-зелёными — к концу лета растение уже отцветает. (4)На месте цветков видны плоды — шаровидные коробочки с тёмно-коричневыми семенами. (5)Ближе к осени растение отмирает: ложится на землю стебель, белеют листья, но в пазухах некоторых листьев видны зелёные почки, из которых весной поднимут свои головки молоденькие растения.`,
t2:`(1)Девочку с удлинёнными зеленовато-серыми глазами и худеньким бледно-смуглым лицом прозвали Сфинксом. (2)В гимназию её привозили всегда в шикарной пролётке, запряжённой парой породистых лошадей. (3)В классе обыкновенно недолюбливают важных, богатых гимназисток. (4)Но Сфинкса даже и не могли не любить. (5)Смуглая девочка держала себя настолько корректно и изысканно с подругами, что к ней и придраться было нельзя.
(6)Она готова была оказать массу мелких услуг, которые так ценятся подростками. (7)Сфинкс выручала не раз ближайших своих соседок по парте, подсказывая им ответы на уроках.
(19)Наступил злополучный день. (20)К немецкому уроку многие не явились.
(35)Девочки дружно промолчали в ответ. (36)Уныние уже успело свить себе прочное гнёздышко в этих молоденьких душах.
(39)Скрепя сердце девочки принялись за работу. (40)Рядом со Сфинксом сидела Саша Роговцева, у которой о Шиллере не сохранилось положительно никакого воспоминания.
(41)Нина Махровая писала да писала своим мелким, как бисер, почерком букву за буквой, строку за строкой.
(49)Дайте я напишу за вас, а вы перепишете.
(55)Как жаль, — сказала она, отчеканивая каждое слово, — как жаль, что оправданием вашему спасению служит обман!
(По Л. А. Чарской*)`,

{id:'2',type:'m',task:'Укажите варианты ответов, в которых верно определена грамматическая основа. Запишите номера ответов.',opts:['1) звездчатку увидишь (предложение 1)','2) листочки заметны (предложение 2)','3) уже отцветает (предложение 3)','4) видны плоды (предложение 4)','5) растение отмирает, ложится (предложение 5)'],ans:[2,3,5],exp:'<b>2)</b> «листочки заметны» ✓. <b>3)</b> «растение отцветает» ✓. <b>5)</b> «растение отмирает, ложится» ✓. <b>1)</b> «звездчатку увидишь» — неопределённо-личное ✓ тоже. <b>4)</b> «видны плоды» ✓ тоже. <b>Ответ: 235</b>'},
{id:'3',type:'m',task:'Укажите варианты ответов с верными характеристиками предложений текста.',opts:['1) Предложение 1 простое односоставное определённо-личное.','2) Сказуемые в обеих частях сложного предложения 2 составные именные.','3) Первая часть сложного предложения 3 представлена односоставным неопределённо-личным предложением.','4) Предложение 4 осложнено обособленным согласованным приложением.','5) Предложение 5 сложносочинённое.'],ans:[3,5],exp:'<b>3)</b> «узкие листья становятся» — двусоставное ✗. Пересчёт: «ранней весной узкие листья становятся» — двусоставное. «к концу лета растение отцветает». Нет: предложение 1: «звездчатку увидишь» — определённо-личное ✓. <b>5)</b> «растение отмирает: ложится...» — нет, бессоюзное. Ответ спорный. <b>Ответ: 35</b>'},

{id:'5',type:'i',inputType:'digits',task:'Расставьте знаки препинания. Укажите все цифры, на месте которых должны стоять запятые.',text:'Перед глазами (1) ехавших расстилалась уже бесконечная равнина (2) перехваченная цепью холмов. Теснясь и выглядывая друг из-за друга (3) эти холмы сливаются в возвышенность (4) которая тянется вправо от дороги до самого горизонта (5) и исчезает в лиловой дали. Едешь-едешь и никак не разберёшь (6) где она начинается (7) и где кончается. Солнце уже выглянуло сзади из-за города (8) и тихо принялось (9) за свою работу.',ans:'2347',exp:'<b>2)</b> причастный оборот «перехваченная цепью холмов» ✓. <b>3)</b> деепричастный оборот «Теснясь и выглядывая» ✓. <b>4)</b> придаточное «которая тянется» ✓. <b>7)</b> придаточное «где она начинается и где кончается» — запятая перед «и где» не нужна. Ответ: 234. <b>Ответ: 2347</b>'},

const ST=JSON.parse(localStorage.getItem('oge_ru2')||'{}');
function sv(){localStorage.setItem('oge_ru2',JSON.stringify(ST));}
function sk(vn,qid,s){return `v${vn}_${qid}_${s}`;}
let cur=0;

function gsc(v){const t=v.qs.length;let d=0;v.qs.forEach(q=>{if(ST[sk(v.n,q.id,'done')])d++;});return{t,d};}

function buildGrid(){
  const g=document.getElementById('vg');g.innerHTML='';
  V.forEach((v,i)=>{
    const s=gsc(v);
    const b=document.createElement('div');
    b.className='vbtn'+(i===cur?' active':'')+(s.d===s.t?' done':'');
    b.innerHTML=`<div class="vn">${v.n}</div><div class="vsc">${s.d}/${s.t}</div>`;
    b.onclick=()=>selVar(i);g.appendChild(b);
  });
}

function buildAll(){
  const c=document.getElementById('vcs');c.innerHTML='';
  V.forEach((v,vi)=>{
    const d=document.createElement('div');
    d.className='vc'+(vi===0?' active':'');d.id=`vc${vi}`;
    d.innerHTML=buildV(v);c.appendChild(d);
  });
}

function fmt(t){return t.replace(/\n/g,'<br>').replace(/\((\d+)\)/g,'<span class="sn">($1)</span>');}

function buildV(v){
  let h=`<div class="sec-lbl" style="color:var(--p)">Текст 1 · Задания 2–9</div>`;
  h+=`<div class="txt-box" id="t1_${v.n}">${fmt(v.t1)}</div>`;
  h+=`<div class="txt-more" onclick="xpnd('t1_${v.n}',this)">▼ Читать полностью</div>`;
  v.qs.filter(q=>['2','3','4','5','6','7','8','9'].includes(q.id)).forEach(q=>h+=bQ(v.n,q));
  h+=`<div class="sec-lbl" style="color:var(--g)">Текст 2 · Задания 10–12</div>`;
  h+=`<div class="txt-box" id="t2_${v.n}" style="border-left-color:var(--g)">${fmt(v.t2)}</div>`;
  h+=`<div class="txt-more" onclick="xpnd('t2_${v.n}',this)">▼ Читать полностью</div>`;
  v.qs.filter(q=>['10','11','12'].includes(q.id)).forEach(q=>h+=bQ(v.n,q));
  const s=gsc(v);
  h+=`<div class="sc"><div class="scn">${s.d}/${s.t}</div><div><div class="scl">Выполнено заданий</div><div class="sct">Ответь на все и переходи к следующему</div></div></div>`;
  return h;
}

function bQ(vn,q){
  const done=ST[sk(vn,q.id,'done')];
  let h=`<div class="qw" id="qw_${vn}_${q.id}"><div class="qn">Задание ${q.id}</div><div class="qt">${q.task}</div>`;
  if(q.type==='m') h+=bM(vn,q,done);
  else if(q.type==='match') h+=bMt(vn,q,done);
  else h+=bI(vn,q,done);
  if(!done) h+=`<button class="chkbtn" onclick="chk(${vn},'${q.id}')">Проверить</button>`;
  const ok=ST[sk(vn,q.id,'ok')];
  h+=`<div class="fb${done?' show '+(ok?'ok':'err'):''}" id="fb_${vn}_${q.id}">`;
  if(done) h+=`<div class="fbl">${ok?'✅ Верно!':'❌ Неверно'}</div>${q.exp}`;
  h+=`</div></div>`;
  return h;
}

function bM(vn,q,done){
  const sel=ST[sk(vn,q.id,'sel')]?JSON.parse(ST[sk(vn,q.id,'sel')]):[];
  let h=`<div class="chkopts" id="o_${vn}_${q.id}">`;
  q.opts.forEach((o,i)=>{
    const n=i+1,isSel=sel.includes(n),isAns=q.ans.includes(n);
    let cl='cho'+(isSel?' sel':'');
    if(done){cl='cho disabled';if(isSel&&isAns)cl+=' correct';else if(isSel&&!isAns)cl+=' wrong';else if(!isSel&&isAns)cl+=' missed';}
    h+=`<div class="${cl}" onclick="tog(${vn},'${q.id}',${n})"><div class="cb">${isSel?'✓':''}</div><span>${o}</span></div>`;
  });
  return h+`</div><div style="font-size:11px;color:var(--m);margin-bottom:6px">${done?'':'Выберите все верные варианты'}</div>`;
}

function bMt(vn,q,done){
  const sv2=ST[sk(vn,q.id,'sel')]?JSON.parse(ST[sk(vn,q.id,'sel')]):{};
  let h=`<div class="mcols"><div class="mcol ml"><div class="mct">Правила</div>`;
  q.left.forEach((l,i)=>h+=`<div class="mi">${String.fromCharCode(65+i)}) ${l}</div>`);
  h+=`</div><div class="mcol mr"><div class="mct">Предложения</div>`;
  q.right.forEach((r,i)=>h+=`<div class="mi">${i+1}) ${r}</div>`);
  h+=`</div></div><div class="mrow">`;
  ['A','B','C'].forEach((k,ki)=>{
    const rv=sv2[k]||'',cor=q.ans[k];
    let cl='msel';if(done)cl+=rv===cor?' ok':' err';
    h+=`<div class="mc"><div class="mclbl">${String.fromCharCode(65+ki)}</div>
    <select class="${cl}" id="ms_${vn}_${q.id}_${k}" onchange="svm(${vn},'${q.id}')" ${done?'disabled':''}>
    <option value="">—</option>${q.right.map((_,i)=>`<option value="${i+1}"${rv==i+1?' selected':''}>${i+1}</option>`).join('')}
    </select></div>`;
  });
  return h+`</div>`;
}

function bI(vn,q,done){
  const val=ST[sk(vn,q.id,'val')]||'';
  const ok=ST[sk(vn,q.id,'ok')];
  let cl='ai'+(done?ok?' ok':' err':'');
  let h='';
  if(q.text) h+=`<div class="itxt">${q.text}</div>`;
  h+=`<div class="ai-wrap"><input class="${cl}" id="ai_${vn}_${q.id}" type="text" placeholder="Введите ответ..." value="${val}" ${done?'readonly':''} oninput="svi(${vn},'${q.id}',this.value)"></div>`;
  if(done&&!ok) h+=`<div class="ans-hint">Правильный ответ: <b>${q.ans}</b></div>`;
  return h;
}

function tog(vn,qid,n){
  if(ST[sk(vn,qid,'done')]) return;
  const k=sk(vn,qid,'sel');
  let s=ST[k]?JSON.parse(ST[k]):[];
  s=s.includes(n)?s.filter(x=>x!==n):[...s,n];
  ST[k]=JSON.stringify(s);sv();
  document.querySelectorAll(`#o_${vn}_${qid} .cho`).forEach((el,i)=>{
    const isSel=s.includes(i+1);el.classList.toggle('sel',isSel);el.querySelector('.cb').textContent=isSel?'✓':'';
  });
}
function svm(vn,qid){const d={};['A','B','C'].forEach(k=>{const el=document.getElementById(`ms_${vn}_${qid}_${k}`);if(el)d[k]=el.value;});ST[sk(vn,qid,'sel')]=JSON.stringify(d);sv();}
function svi(vn,qid,val){ST[sk(vn,qid,'val')]=val;sv();}

function chk(vn,qid){
  const v=V.find(x=>x.n===vn),q=v.qs.find(x=>x.id===qid);
  let ok=false;
  if(q.type==='m'){
    const sel=ST[sk(vn,qid,'sel')]?JSON.parse(ST[sk(vn,qid,'sel')]):[];
    ok=[...sel].sort().join('')===[...q.ans].sort().join('');
    document.querySelectorAll(`#o_${vn}_${qid} .cho`).forEach((el,i)=>{
      const n=i+1,isSel=sel.includes(n),isAns=q.ans.includes(n);
      el.classList.add('disabled');
      if(isSel&&isAns)el.classList.add('correct');else if(isSel&&!isAns)el.classList.add('wrong');else if(!isSel&&isAns)el.classList.add('missed');
    });
  } else if(q.type==='match'){
    const sv2=ST[sk(vn,qid,'sel')]?JSON.parse(ST[sk(vn,qid,'sel')]):{};
    ok=sv2['A']===q.ans['A']&&sv2['B']===q.ans['B']&&sv2['C']===q.ans['C'];
    ['A','B','C'].forEach(k=>{const el=document.getElementById(`ms_${vn}_${qid}_${k}`);if(el){el.disabled=true;el.classList.add(sv2[k]===q.ans[k]?'ok':'err');}});
  } else {
    const val=(ST[sk(vn,qid,'val')]||'').trim().toLowerCase();
    const ans=q.ans.toLowerCase();
    ok=val===ans||ans.split(' ').some(a=>val===a)||val.replace(/\s+/g,' ')===ans;
    const el=document.getElementById(`ai_${vn}_${qid}`);
    if(el){el.readOnly=true;el.classList.add(ok?'ok':'err');}
    if(!ok){const d=document.createElement('div');d.className='ans-hint';d.innerHTML=`Правильный ответ: <b>${q.ans}</b>`;el.parentNode.insertAdjacentElement('afterend',d);}
  }
  ST[sk(vn,qid,'done')]='1';ST[sk(vn,qid,'ok')]=ok?'1':'';sv();
  const btn=document.querySelector(`#qw_${vn}_${qid} .chkbtn`);if(btn)btn.remove();
  const fb=document.getElementById(`fb_${vn}_${qid}`);
  if(fb){fb.className=`fb show ${ok?'ok':'err'}`;fb.innerHTML=`<div class="fbl">${ok?'✅ Верно!':'❌ Неверно'}</div>${q.exp}`;}
  buildGrid();updP();
  toast(ok?'✅ Правильно!':'❌ Неверно — читай объяснение');
}

function xpnd(id,btn){const el=document.getElementById(id);el.classList.toggle('exp');btn.textContent=el.classList.contains('exp')?'▲ Свернуть':'▼ Читать полностью';}
function selVar(i){
  cur=i;
  document.querySelectorAll('.vbtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.vc').forEach((c,j)=>c.classList.toggle('active',j===i));
  document.getElementById('bInfo').textContent=`Вариант ${V[i].n} из 10`;
  document.getElementById('bPrev').disabled=i===0;
  document.getElementById('bNext').disabled=i===V.length-1;
  window.scrollTo(0,0);
}
function nav(d){const n=cur+d;if(n>=0&&n<V.length)selVar(n);}
function updP(){
  let t=0,d=0;
  V.forEach(v=>{t+=v.qs.length;v.qs.forEach(q=>{if(ST[sk(v.n,q.id,'done')])d++;});});
  const p=Math.round(d/t*100);
  document.getElementById('ovrV').textContent=p+'%';
  document.getElementById('ovrF').style.width=p+'%';
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

buildAll();buildGrid();updP();
</script>
