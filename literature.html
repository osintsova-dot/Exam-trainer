<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d1a">
<title>ОГЭ · Литература · 10 вариантов</title>
<style>
:root{
  --bg:#0d0d1a;--s1:#161625;--s2:#1f1f35;--s3:#282840;
  --p:#b06dff;--g:#ffc94d;--gr:#00e5a0;--r:#ff4d6d;--bl:#4d9fff;
  --t:#ede8ff;--m:#7a6fa0;--rad:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:'SF Pro Text','Helvetica Neue',Arial,sans-serif;min-height:100vh;padding-bottom:90px}

.hdr{padding:18px 18px 0;background:var(--bg)}
.app-lbl{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--m)}
.app-title{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:800;margin-top:4px;margin-bottom:14px}

/* VARIANT SELECTOR */
.var-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px;margin-bottom:14px}
.var-btn{background:var(--s1);border:1.5px solid rgba(255,255,255,.07);border-radius:11px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s}
.var-btn.active{background:var(--p);border-color:var(--p)}
.var-n{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:800}
.var-prog{font-size:10px;color:var(--m);margin-top:2px}
.var-btn.active .var-prog{color:rgba(255,255,255,.7)}
.var-btn.done{border-color:var(--gr)}
.var-btn.done .var-n{color:var(--gr)}

/* VARIANT CONTENT */
.var-content{padding:0 18px;display:none}
.var-content.active{display:block}

.part-title{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--p);margin-bottom:10px;margin-top:20px}
.work-title{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:800;margin-bottom:10px}
.author{font-size:12px;color:var(--m);margin-bottom:12px;font-weight:600}

/* TEXT BLOCK */
.txt-block{background:var(--s1);border-radius:var(--rad);padding:16px;font-size:13px;line-height:1.8;margin-bottom:14px;border-left:3px solid var(--p);max-height:260px;overflow-y:auto}
.txt-block.poem{border-left-color:var(--g);font-style:italic;white-space:pre-line}
.txt-block.expanded{max-height:none}
.expand-btn{text-align:center;font-size:12px;color:var(--p);cursor:pointer;padding:6px;margin-top:-8px;margin-bottom:8px}

/* QUESTION */
.q-block{background:var(--s1);border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid rgba(176,109,255,.1)}
.q-num{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--p);margin-bottom:6px}
.q-text{font-size:14px;line-height:1.55;margin-bottom:10px;font-weight:500}
.q-hint{font-size:11px;color:var(--m);margin-bottom:8px;font-style:italic}
.answer-area{width:100%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--t);font-family:'SF Pro Text','Helvetica Neue',Arial,sans-serif;resize:none;min-height:80px;transition:border-color .2s;line-height:1.6}
.answer-area:focus{outline:none;border-color:var(--p)}
.q-actions{display:flex;gap:8px;margin-top:8px}
.btn-ref{flex:1;background:rgba(176,109,255,.15);border:1.5px solid rgba(176,109,255,.3);color:var(--p);padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'SF Pro Text','Helvetica Neue',Arial,sans-serif}
.btn-save{flex:1;background:var(--p);border:none;color:#fff;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'SF Pro Text','Helvetica Neue',Arial,sans-serif}
.ref-block{background:rgba(0,229,160,.07);border:1.5px solid rgba(0,229,160,.2);border-radius:10px;padding:12px;margin-top:8px;font-size:12px;line-height:1.6;display:none}
.ref-block.show{display:block}
.ref-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gr);margin-bottom:5px}
.saved-badge{font-size:11px;color:var(--gr);margin-top:6px;display:none}
.saved-badge.show{display:block}

/* RATING */
.rating-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.rating-lbl{font-size:11px;color:var(--m);flex-shrink:0}
.stars{display:flex;gap:5px}
.star{width:32px;height:32px;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;color:var(--m)}
.star.active{background:rgba(255,201,77,.15);border-color:var(--g);color:var(--g)}
.rating-val{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:800;color:var(--g);min-width:30px}

/* REPORT */
.report-card{background:var(--s1);border-radius:var(--rad);padding:14px;margin:0 18px 14px;border:1px solid rgba(255,201,77,.15)}
.report-title{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:800;margin-bottom:10px;color:var(--g)}
.report-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.report-row:last-child{border-bottom:none}
.report-var{font-size:12px;color:var(--m)}
.report-stars{font-size:13px}
.report-avg{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:800}
.report-empty{text-align:center;font-size:12px;color:var(--m);padding:10px 0}

/* ESSAY TOPICS */
.essay-block{background:var(--s1);border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid rgba(255,201,77,.1)}
.essay-num{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g);margin-bottom:5px}
.essay-text{font-size:13px;line-height:1.55}

/* DIVIDER */
.divider{height:1px;background:rgba(255,255,255,.06);margin:20px 0}

/* PROGRESS BAR */
.var-progress{background:var(--s1);border-radius:12px;padding:12px 14px;margin:0 18px 14px}
.vp-row{display:flex;justify-content:space-between;margin-bottom:7px}
.vp-lbl{font-size:12px;color:var(--m)}
.vp-val{font-family:'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700;color:var(--p)}
.vp-track{height:4px;background:var(--s3);border-radius:10px;overflow:hidden}
.vp-fill{height:100%;background:var(--p);border-radius:10px;transition:width .4s ease}

/* BOTTOM NAV */
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,26,.96);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.nav-back{color:var(--p);font-size:13px;font-weight:700;cursor:pointer;padding:8px 16px;background:rgba(176,109,255,.12);border-radius:20px}
.nav-info{font-size:11px;color:var(--m);text-align:center}
.nav-next{color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:8px 16px;background:var(--p);border-radius:20px}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--s1);border:1px solid rgba(176,109,255,.3);color:var(--t);padding:10px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="hdr">
  <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--p);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:10px;background:rgba(176,109,255,.12);padding:6px 14px;border-radius:20px">← Назад к тренажёру</a>
  <div class="app-lbl">ОГЭ 2026 · Литература · Самойлова</div>
  <div class="app-title">10 тренировочных вариантов</div>
</div>

<div class="var-progress">
  <div class="vp-row">
    <div class="vp-lbl">Общий прогресс</div>
    <div class="vp-val" id="totalProg">0%</div>
  </div>
  <div class="vp-track"><div class="vp-fill" id="totalFill" style="width:0%"></div></div>
</div>

<div class="report-card" id="reportCard">
  <div class="report-title">📊 Отчёт по вариантам</div>
  <div id="reportList"><div class="report-empty">Оцени задания — здесь появится отчёт</div></div>
</div>

<div class="var-grid" id="varGrid"></div>

<!-- VARIANT CONTENTS -->
<div id="varContents"></div>

<div class="bot-nav" id="botNav" style="display:none">
  <div class="nav-back" onclick="navVariant(-1)">← Пред.</div>
  <div class="nav-info" id="navInfo"></div>
  <div class="nav-next" onclick="navVariant(1)">След. →</div>
</div>

<script>
// ══════════════════════════════════════════════════════
// ДАННЫЕ — 10 ВАРИАНТОВ из сборника Самойловой ОГЭ 2026
// ══════════════════════════════════════════════════════
const VARIANTS = [

{
  n:1,
  prose:{
    author:"М.Е. Салтыков-Щедрин",
    work:"«Повесть о том, как один мужик двух генералов прокормил»",
    text:`...Жили да были два генерала, и так как оба были легкомысленны, то в скором времени, по щучьему велению, по моему хотению, очутились на необитаемом острове.
Служили генералы всю жизнь в какой-то регистратуре; там родились, воспитались и состарились, следовательно, ничего не понимали. Даже слов никаких не знали, кроме: «Примите уверение в совершенном моём почтении и преданности».
Стали они друг друга рассматривать и увидели, что они в ночных рубашках, а на шеях у них висит по ордену.
— Теперь бы кофейку испить хорошо! — молвил один генерал, но вспомнил, какая с ним неслыханная штука случилась, и во второй раз заплакал.
— Кто бы мог думать, ваше превосходительство, что человеческая пища, в первоначальном виде, летает, плавает и на деревьях растёт? — сказал один генерал.
— Да, — отвечал другой генерал, — признаться, и я до сих пор думал, что булки в том самом виде родятся, как их утром к кофею подают!
— Теперь я бы, кажется, свой собственный сапог съел! — сказал один генерал.
— Хороши тоже перчатки бывают, когда долго ношены! — вздохнул другой генерал.`,
    qs:[
      {n:"1.1",text:"Почему генералы не могут раздобыть себе еды, хотя вокруг — изобилие пищи?",ref:"Генералы всю жизнь прожили в системе, где за них всё делали другие. Они не умеют ничего физически делать — не могут залезть на дерево, поймать рыбу, разжечь огонь. Гоголь высмеивает паразитизм дворянства, полную беспомощность «верхушки» без «мужика»."},
      {n:"1.2",text:"Какую роль в сказке М.Е. Салтыкова-Щедрина играет гротеск?",ref:"Гротеск — преувеличение, доведённое до абсурда. Генералы, не знающие, откуда берётся еда, орден на шее в ночной рубашке — гротескные образы. Гротеск обнажает нелепость и паразитизм чиновничьего класса, делая сатиру острее."},
    ]
  },
  poem:{
    author:"Н.М. Рубцов",
    work:"«Душа хранит» (1966)",
    text:`Вода недвижнее стекла.
И в глубине её светло.
И только щука, как стрела,
Пронзает водное стекло.
О, вид, смиренный и родной!
Берёзы, избы по буграм
И, отражённый глубиной,
Как сон столетий, божий храм.
О, Русь — великий звездочёт!
Как звёзд не свергнуть с высоты,
Так век неслышно протечёт,
Не тронув этой красоты;
Как будто древний этот вид
Раз навсегда запечатлён
В душе, которая хранит
Всю красоту былых времён...`,
    qs:[
      {n:"3.1",text:"В чём, по мысли поэта, выражается «красота былых времён»?",ref:"Красота — в вечных, неизменных образах родины: берёзы, избы, храм, тихая вода. Рубцов видит в этой неизменности духовную глубину: душа народа хранит образы прошлого как что-то священное. Красота — не в роскоши, а в смиренном, родном пейзаже."},
      {n:"3.2",text:"Как текст стихотворения Н.М. Рубцова соотносится с его заглавием?",ref:"Заглавие «Душа хранит» — смысловой итог стихотворения. На протяжении всего текста поэт описывает образы родины, а финал объясняет: эти образы вечны, потому что хранятся в душе. Заглавие — одновременно и тема, и главная мысль."},
      {n:"4",text:"В чём сходство образных картин в стихотворениях А.А. Блока «Река раскинулась...» и Н.М. Рубцова «Душа хранит»?",
       poem2:`Река раскинулась. Течёт, грустит лениво
И моет берега.
Над скудной глиной жёлтого обрыва
В степи грустят стога.
О, Русь моя! Жена моя! До боли
Нам ясен долгий путь!
Наш путь — стрелой татарской древней воли
Пронзил нам грудь.
И вечный бой! Покой нам только снится
Сквозь кровь и пыль...
Летит, летит степная кобылица
И мнёт ковыль...
(А.А. Блок, 1908)`,
       ref:"Оба стихотворения обращены к образу России/Руси через природу. У Рубцова — тихий, смиренный пейзаж, покой и вечность. У Блока — динамика, тревога, «вечный бой». Сходство: оба поэта видят в природе душу Родины. Различие: Рубцов — созерцание и покой, Блок — движение и боль."},
    ]
  },
  essays:["Какую роль играют авторские отступления в романе А.С. Пушкина «Евгений Онегин»?","Чем интересен характер главного героя романа М.Ю. Лермонтова «Герой нашего времени»?","Над какими вопросами заставляет нас задуматься комедия Н.В. Гоголя «Ревизор»?","Как в лирике русских поэтов ХХ века раскрывается тема исторической памяти? (На примере 2–3 стихотворений одного из поэтов.)","Какие произведения отечественной и зарубежной литературы кажутся вам актуальными и почему?"]
},

{
  n:2,
  prose:{
    author:"В.М. Шукшин",
    work:"«Чудик»",
    text:`...Чудик прибрал постель, умылся и стал думать, что бы такое приятное сделать снохе. Тут на глаза попалась детская коляска. «Эге, — подумал Чудик, — разрисую-ка я её». Нашёл ребячьи краски, кисточку и принялся за дело. Через час всё было кончено, коляску не узнать. По верху колясочки Чудик пустил журавликов — стайку уголком, по низу — цветочки разные, травку-муравку, пару петушков, цыпляток...
— А ты говоришь — деревня. Чудачка. — Он хотел мира со снохой. — Ребёнок-то как в корзиночке будет.
Чудик поспешил сойти с крыльца... А дальше не знал, что делать. Опять ему стало больно. Когда его ненавидели, ему было очень больно. И страшно. Казалось: ну, теперь всё, зачем же жить? И хотелось уйти подальше от людей, которые ненавидят его или смеются.
— Да почему же я такой есть-то? — горько шептал он, сидя в сарайчике. — Надо бы догадаться: не поймёт ведь она, не поймёт народного творчества.
Домой Чудик приехал, когда шёл рясный парной дождик. Чудик вышел из автобуса, снял новые ботинки, побежал по тёплой мокрой земле — в одной руке чемодан, в другой ботинки. Подпрыгивал и громко пел: «Тополя-а, тополя-а...»`,
    qs:[
      {n:"1.1",text:"Почему главного героя рассказа называют Чудиком?",ref:"Чудик — человек не от мира сего: искренний, непосредственный, живущий по законам красоты и добра, а не по правилам «нормального» общества. Он рисует коляску из добрых побуждений — но мир его не понимает. «Чудик» — ласковое и одновременно грустное прозвище человека, отличающегося от окружающих своей душевной чистотой."},
      {n:"1.2",text:"Какую роль в рассказе «Чудик» играет финал?",ref:"Финал — Чудик бежит под дождём, поёт — светлый и жизнеутверждающий. Несмотря на обиду, он не ожесточился. Финал подчёркивает главное: Чудик не сломлен, его доброта и радость жизни сильнее чужой злобы. Это авторский вывод о ценности такого человека."},
    ]
  },
  poem:{
    author:"М.Ю. Лермонтов",
    work:"«Родина» (1841)",
    text:`Люблю отчизну я, но странною любовью!
Не победит её рассудок мой.
Ни слава, купленная кровью,
Ни полный гордого доверия покой,
Ни тёмной старины заветные преданья
Не шевелят во мне отрадного мечтанья.
Но я люблю — за что, не знаю сам —
Её степей холодное молчанье,
Её лесов безбрежных колыханье,
Разливы рек её, подобные морям;
Просёлочным путём люблю скакать в телеге
И, взором медленным пронзая ночи тень,
Встречать по сторонам, вздыхая о ночлеге,
Дрожащие огни печальных деревень.
Люблю дымок спалённой жнивы,
В степи ночующий обоз,
И на холме средь жёлтой нивы
Чету белеющих берёз.
С отрадой многим незнакомой
Я вижу полное гумно,
Избу, покрытую соломой,
С резными ставнями окно;
И в праздник, вечером росистым,
Смотреть до полночи готов
На пляску с топаньем и свистом
Под говор пьяных мужичков.`,
    qs:[
      {n:"3.1",text:"Как в стихотворении М.Ю. Лермонтова раскрывается тема родины?",ref:"Лермонтов любит Родину «странной любовью» — не за официальный патриотизм, не за историческую славу, а за живую народную жизнь: пейзажи, деревни, крестьянский быт. Тема раскрывается через противопоставление «казённой» любви к отчизне и личной, непосредственной любви к простой народной России."},
      {n:"3.2",text:"В чём особенности композиции стихотворения М.Ю. Лермонтова «Родина»?",ref:"Стихотворение делится на две части: первая (отрицание) — что НЕ трогает сердце поэта (слава, история), вторая (утверждение) — что он любит на самом деле (природа, крестьянская жизнь). Такая антитезная композиция усиливает главную мысль об «особой» любви к Родине."},
      {n:"4",text:"В чём сходство темы родины в стихотворениях М.Ю. Лермонтова «Родина» и В.Ф. Бокова «Откуда начинается Россия?»?",
       poem2:`Откуда начинается Россия?
С Курил? С Камчатки? Или с Командор?
О чём грустят глаза её степные
Над камышами всех её озёр?
Россия начинается с пристрастья
к труду, к терпенью, к правде, к доброте.
Вот в чём её звезда. Она прекрасна!
Она горит и светит в темноте.
И если ты причастен к ней —
Россия не с гор берёт начало, а с тебя!
(В.Ф. Боков, 1962)`,
       ref:"Оба поэта ищут подлинную Россию не в официальных символах, а в живой жизни. Лермонтов находит её в природе и крестьянском быте. Боков — в нравственных качествах народа: труде, правде, доброте. Общее: Россия — не государство, а люди и их душа. Различие: Лермонтов — созерцатель, Боков — призывает к личной причастности."},
    ]
  },
  essays:["Почему побег из монастыря приводит к гибели главного героя поэмы М.Ю. Лермонтова «Мцыри»?","Какую роль играют авторские пояснения (ремарки) в комедии Н.В. Гоголя «Ревизор»?","Над какими вопросами заставляют нас задуматься рассказы И.А. Бунина?","Как в лирике русских поэтов ХХ века раскрывается тема патриотизма?","В каких произведениях проблема поиска смысла жизни раскрывается как личностное переживание?"]
},

{
  n:3,
  prose:{
    author:"М.Ю. Лермонтов",
    work:"«Герой нашего времени» (Журнал Печорина, 11 мая)",
    text:`Вчера я приехал в Пятигорск, нанял квартиру на краю города, на самом высоком месте, у подошвы Машука: во время грозы облака будут спускаться до моей кровли.
Нынче в пять часов утра, когда я открыл окно, моя комната наполнилась запахом цветов, растущих в скромном палисаднике. Ветки цветущих черешен смотрят мне в окна, и ветер иногда усыпает мой письменный стол их белыми лепестками. Вид с трёх сторон у меня чудесный. На запад пятиглавый Бешту синеет, как «последняя туча рассеянной бури»; на север поднимается Машук, как мохнатая персидская шапка, и закрывает всю эту часть небосклона; на восток смотреть веселее: внизу передо мною пестреет чистенький, новенький городок, шумят целебные ключи, шумит разноязычная толпа, — а там, дальше, амфитеатром громоздятся горы всё синее и туманнее, а на краю горизонта тянется серебряная цепь снеговых вершин, начинаясь Казбеком и оканчиваясь двуглавым Эльборусом... Весело жить в такой земле! Какое-то отрадное чувство разлито во всех моих жилах. Воздух чист и свеж, как поцелуй ребёнка; солнце ярко, небо сине — чего бы, кажется, больше? — зачем тут страсти, желания, сожаления?..`,
    qs:[
      {n:"1.1",text:"Зачем, по-вашему, в дневниковые записи Печорина автор включает описания природы?",ref:"Пейзаж в дневнике Печорина — отражение его душевного состояния. Когда он описывает красоту Кавказа, на время кажется, что он способен радоваться жизни. Но за этим восторгом — вопрос: «зачем тут страсти, желания?» — то есть природа лишь на мгновение заглушает внутреннюю пустоту. Пейзаж = психологический портрет."},
      {n:"1.2",text:"Какие художественные средства и приёмы помогают М.Ю. Лермонтову передать настроение героя?",ref:"Сравнения («как поцелуй ребёнка», «как мохнатая персидская шапка»), эпитеты («серебряная цепь», «отрадное чувство»), восклицания и риторические вопросы — все средства передают восторженное, почти лирическое настроение. Однако вопрос в конце («зачем страсти?») выдаёт противоречие: восторг не настоящий."},
    ]
  },
  poem:{
    author:"А.С. Пушкин",
    work:"«К***» («Я помню чудное мгновенье...», 1825)",
    text:`Я помню чудное мгновенье:
Передо мной явилась ты,
Как мимолётное виденье,
Как гений чистой красоты.
В томленьях грусти безнадёжной,
В тревогах шумной суеты,
Звучал мне долго голос нежный
И снились милые черты.
Шли годы. Бурь порыв мятежный
Рассеял прежние мечты,
И я забыл твой голос нежный,
Твои небесные черты.
В глуши, во мраке заточенья
Тянулись тихо дни мои
Без божества, без вдохновенья,
Без слёз, без жизни, без любви.
Душе настало пробужденье:
И вот опять явилась ты,
Как мимолётное виденье,
Как гений чистой красоты.
И сердце бьётся в упоенье,
И для него воскресли вновь
И божество, и вдохновенье,
И жизнь, и слёзы, и любовь.`,
    qs:[
      {n:"3.1",text:"Какие эмоции переживает лирический герой стихотворения А.С. Пушкина?",ref:"Стихотворение — путь от восхищения через забвение и душевную пустоту («без божества, без вдохновенья») к новому пробуждению. Герой переживает восторг встречи, тоску разлуки, опустошённость и финальное воскрешение чувств. Любовь показана как источник жизни и вдохновения."},
      {n:"3.2",text:"Как биографические факты из жизни автора связаны с тематикой стихотворения «К***»?",ref:"Стихотворение посвящено Анне Керн. Написано в 1825 году при новой встрече с ней спустя годы. «Мрак заточенья» — Михайловская ссылка Пушкина. Биографический контекст усиливает искренность: это не просто лирика, а реальное переживание, зафиксированное в стихе."},
      {n:"4",text:"Какие мотивы и образы сближают стихотворения А.С. Пушкина «К***» и Б.Ш. Окуджавы «Тьмою здесь всё занавешено...»?",
       poem2:`Тьмою здесь всё занавешено
и тишина, как на дне...
Ваше величество женщина,
да неужели — ко мне?
Тусклое здесь электричество,
с крыши сочится вода.
Женщина, ваше величество,
как вы решились сюда?
О, ваш приход — как пожарище.
Дымно, и трудно дышать...
(Б.Ш. Окуджава, 1960)`,
       ref:"Оба стихотворения — о появлении прекрасной женщины, которая преображает мир лирического героя. У Пушкина — «чудное мгновенье», пробуждение души. У Окуджавы — «пожарище», потрясение. Общий мотив: женская красота как свет, врывающийся в тьму. Различие в интонации: Пушкин — торжественно, Окуджава — иронично и нежно."},
    ]
  },
  essays:["Почему герои комедии Д.И. Фонвизина «Недоросль» носят столь неблагозвучные фамилии?","В чём смысл названия романа М.Ю. Лермонтова «Герой нашего времени»?","Над какими вопросами заставляют нас задуматься повести И.С. Тургенева?","Как в лирике русских поэтов ХХ века раскрывается любовная тема?","В каких произведениях звучит тема неразделённой любви?"]
},

{
  n:4,
  prose:{
    author:"А.С. Пушкин",
    work:"«Евгений Онегин» (сцена объяснения с Татьяной)",
    text:`...к ней Онегин подошёл
И молвил: «Вы ко мне писали,
Не отпирайтесь. Я прочёл
Души доверчивой признанья,
Любви невинной излиянья;
Мне ваша искренность мила;
Она в волненье привела
Давно умолкнувшие чувства;
Но вас хвалить я не хочу;
Я за неё вам отплачу
Признаньем также без искусства;
Примите исповедь мою:
Себя на суд вам отдаю.
Но я не создан для блаженства;
Ему чужда душа моя;
Напрасны ваши совершенства:
Их вовсе недостоин я.
Поверьте (совесть в том порукой),
Супружество нам будет мукой.
Я, сколько ни любил бы вас,
Привыкнув, разлюблю тотчас;
Начнёте плакать: ваши слёзы
Не тронут сердца моего,
А будут лишь бесить его.
Судите ж вы, какие розы
Нам заготовит Гименей
И, может быть, на много дней...»`,
    qs:[
      {n:"1.1",text:"Как вы думаете, почему Евгений Онегин остался холоден к влюблённой в него Татьяне?",ref:"Онегин — «лишний человек»: пресыщён светской жизнью, разочарован, не способен на глубокое чувство. Он честен с Татьяной — признаёт её совершенства, но говорит, что не создан для семейного счастья. Его холодность — не злой умысел, а следствие внутренней пустоты и неспособности любить."},
      {n:"1.2",text:"Какие особенности сцены позволяют герою назвать свой монолог «исповедью»?",ref:"Онегин говорит искренне — без притворства, без лести, признаёт собственные недостатки. Исповедь предполагает честность и саморазоблачение. Автор же называет это «проповедью», иронизируя: Онегин поучает Татьяну, как ей жить. Разница между самооценкой героя и авторской иронией — важный художественный приём."},
    ]

  poem:{
    author:"А.А. Фет",
    work:"«Ещё весны душистой нега...» (1854)",
    text:`Ещё весны душистой нега
К нам не успела низойти,
Ещё овраги полны снега,
Ещё зарёй гремит телега
На замороженном пути.
Едва лишь в полдень солнце греет,
Краснеет липа в высоте.
Сквозя, березник чуть желтеет,
И соловей ещё не смеет
Запеть в смородинном кусте.
Но возрожденья весть живая
Уж есть в прилётных журавлях,
И, их глазами провожая,
Стоит красавица степная
С румянцем сизым на щеках.`,
    qs:[
      {n:"3.1",text:"Каким настроением проникнуто стихотворение А.А. Фета «Ещё весны душистой нега...»?",ref:"Стихотворение пронизано ощущением ожидания и предчувствия: весна ещё не пришла, но уже чувствуется её приближение. Настроение — светлое, тихое, полное надежды. Образ «красавицы степной» с румянцем олицетворяет саму весну — живую, робкую, ещё нерешительную."},
      {n:"3.2",text:"Какие изобразительно-выразительные средства использует А.А. Фет для создания художественных образов?",ref:"Олицетворения: «соловей не смеет запеть», «природа ждёт». Эпитеты: «душистая нега», «замороженный путь». Анафора «ещё...ещё...ещё» создаёт ощущение медленного движения. Образ «красавицы степной» — олицетворение весны. Все средства работают на передачу тонкого перехода между зимой и весной."},
      {n:"4",text:"В чём сходство и различие трактовки темы природы в стихотворениях А.А. Фета и Ф.И. Тютчева «Ещё земли печален вид...»?",
       poem2:`Ещё земли печален вид,
А воздух уж весною дышит,
И мёртвый в поле стебль колышет,
И елей ветви шевелит.
Ещё природа не проснулась,
Но сквозь редеющего сна
Весну послышала она
И ей невольно улыбнулась...
Душа, душа, спала и ты...
Или весенняя то нега?..
Или то женская любовь?
(Ф.И. Тютчев, 1836)`,
       ref:"Оба стихотворения — о переходе от зимы к весне. Сходство: используют образ пробуждения природы, анафору «ещё». Различие: у Фета — чисто пейзажная лирика, весна как внешнее явление. У Тютчева — природа служит поводом для философского вопроса о душе человека. Тютчев переходит от пейзажа к внутреннему миру, Фет остаётся в мире природы."},
    ]
  },
  essays:["Почему А.С. Грибоедов назвал свою пьесу «Горе от ума» комедией?","Над какими вопросами, волновавшими автора, заставляет задуматься роман М.Ю. Лермонтова «Герой нашего времени»?","В чём иносказательный смысл сказок М.Е. Салтыкова-Щедрина?","Чем герой поэмы А.Т. Твардовского «Василий Тёркин» близок героям русского фольклора?","В каких произведениях звучит вера в неограниченные возможности человеческого разума?"]

{
  n:5,
  prose:{
    author:"А.С. Пушкин",
    work:"«Капитанская дочка» (сон Гринёва)",
    text:`Мне приснился сон, которого никогда не мог я позабыть и в котором до сих пор вижу нечто пророческое, когда соображаю с ним странные обстоятельства моей жизни.
Я находился в том состоянии чувств и души, когда существенность, уступая мечтаниям, сливается с ними в неясных видениях первосония. Мне казалось, буран ещё свирепствовал и мы ещё блуждали по снежной пустыне...
Вдруг увидел я вороты и въехал на барский двор нашей усадьбы. Матушка встречает меня на крыльце с видом глубокого огорчения. «Тише, — говорит она мне, — отец болен, при смерти, и желает с тобою проститься». Вижу, комната слабо освещена; у постели стоят люди с печальными лицами. Я тихонько подхожу к постели; матушка приподымает полог и говорит: «Андрей Петрович, Петруша приехал». Что ж?.. Вместо отца моего вижу в постели лежит мужик с чёрной бородою, весело на меня поглядывая.
«Что это значит? Это не батюшка. И к какой мне стати просить благословения у мужика?» — «Всё равно, Петруша, — отвечала мне матушка, — это твой посажёный отец; поцелуй у него ручку, и пусть он тебя благословит...» Тогда мужик вскочил с постели, выхватил топор из-за спины и стал махать во все стороны. Страшный мужик ласково меня кликал, говоря: «Не бойсь, подойди под моё благословение...»`,
    qs:[
      {n:"1.1",text:"Почему сон, о котором рассказывается в данном фрагменте, Гринёв называет «пророческим»?",ref:"Сон пророческий: мужик с топором, дающий благословение, — это Пугачёв. В реальности Пугачёв сыграет роль «посажёного отца» — спасёт Гринёва и «благословит» его связь с Машей. Топор — символ бунта и власти. Сон предсказывает весь сюжет: Гринёв будет связан с Пугачёвым судьбой."},
      {n:"1.2",text:"Какую роль играет этот эпизод в общей композиции романа?",ref:"Сон — завязка символической линии романа. Он готовит читателя к встрече с Пугачёвым, создаёт атмосферу тревоги и тайны. Композиционно: сон предшествует буране, в котором Гринёв впервые встречает вожатого (Пугачёва). Сон и реальность зеркально отражают друг друга."},
    ]
  },
  poem:{
    author:"Д.Б. Кедрин",
    work:"«Алёнушка» (1942)",
    text:`Стойбище осеннего тумана,
Вотчина ночного соловья,
Тихая царевна Несмеяна —
Родина неяркая моя!
Знаю, что не раз лихая сила
У глухой околицы в лесу
Ножичек сапожный заносила
На твою нетленную красу.
Только всё ты вынесла и снова
За раздольем нив, где зреет рожь,
На пеньке у омута лесного
Песенку Алёнушки поёшь...
Я бродил бы тридцать лет по свету,
А к тебе вернулся б умирать,
Потому что в детстве песню эту,
Знать, и надо мной певала мать!`,
    qs:[
      {n:"3.1",text:"Почему родина видится поэту то «царевной Несмеяной», то поющей Алёнушкой?",ref:"«Царевна Несмеяна» — образ печальной, негромкой, неброской России. «Алёнушка» — образ из народных сказок, живой, поющей, стойкой. Оба образа — из фольклора: поэт видит Родину через призму народной культуры. Вместе они создают образ России, которая грустит, но не сдаётся."},
      {n:"3.2",text:"Как тема любви к родине связана в стихотворении Д.Б. Кедрина с темой детства?",ref:"В финале поэт признаётся: любовь к Родине — это любовь к матери, к детству. «Песенку... надо мной певала мать» — детская память неотделима от образа Родины. Это интимная, личная любовь, уходящая корнями в детство. Родина = мать = детство — три образа сливаются в один."},
      {n:"4",text:"В чём сходство и различие образов Родины в стихотворениях Д.Б. Кедрина «Алёнушка» и П.Н. Шубина «Всё, что видывал — не видывал...»?",
       poem2:`Всё, что видывал — не видывал,
Что забыл — не позабыл,
Что давно в уме прикидывал,
Я бы в песню всё сложил.
В ней бы плыли гуси-лебеди
За Окою в забытьи,
В тополином тихом трепете
Замирали б соловьи.
Только песня есть красивее

Всё, что пройдено и прожито,
Всё тобой озарено,
Милая навеки Родина,
Детства милое окно!

    text:`...Очумелов глядит в сторону и видит: из дровяного склада купца Пичугина, прыгая на трёх ногах и оглядываясь, бежит собака. За ней гонится человек в ситцевой крахмальной рубахе и расстёгнутой жилетке.
— По какому это случаю тут? — спрашивает Очумелов, врезываясь в толпу. — Почему тут? Это ты зачем палец?..
— Иду я, ваше благородие, никого не трогаю... — начинает Хрюкин. — Насчёт дров с Митрий Митричем, — и вдруг эта подлая ни с того ни с сего за палец... Пущай мне заплатят, потому — я этим пальцем, может, неделю не пошевельну...
— Хорошо... — говорит Очумелов строго. — Чья собака? Я этого так не оставлю. Я покажу вам, как собак распускать! Как оштрафуют его, мерзавца, так он узнает у меня, что значит собака и прочий бродячий скот! Я ему покажу Кузькину мать!..
— Это, кажись, генерала Жигалова! — кричит кто-то из толпы.
— Генерала Жигалова? Гм!.. Сними-ка, Елдырин, с меня пальто... Ужас как жарко! Должно полагать, перед дождём... Одного только я не понимаю: как она могла тебя укусить? — обращается Очумелов к Хрюкину. — Нешто она достанет до пальца? Она маленькая, а ты ведь вон какой здоровила! Ты, должно быть, расковырял палец гвоздиком...`,

  poem:{
    author:"М.Ю. Лермонтов",
    work:"«Нет, не тебя так пылко я люблю...» (1841)",
    text:`Нет, не тебя так пылко я люблю,
Не для меня красы твоей блистанье:
Люблю в тебе я прошлое страданье
И молодость погибшую мою.
Когда порой я на тебя смотрю,
В твои глаза вникая долгим взором:
Таинственным я занят разговором,
Но не с тобой я сердцем говорю.
Я говорю с подругой юных дней,
В твоих чертах ищу черты другие,
В устах живых уста давно немые,
В глазах огонь угаснувших очей.`,
    qs:[
      {n:"3.1",text:"Какой представляется вам лирическая героиня стихотворения М.Ю. Лермонтова?",ref:"В стихотворении две женщины: реальная — та, к кому обращается герой, и призрак — давно любимая, умершая или ушедшая. Реальная — лишь «зеркало» для воспоминаний. Лирический герой не видит её саму — он видит в ней образ прошлого. Это делает стихотворение глубоко трагическим."},
      {n:"3.2",text:"В чём особенности композиционного строения стихотворения «Нет, не тебя так пылко я люблю...»?",ref:"Сонетная структура (14 строк, три катрена и куплет). Построено на антитезе: «не тебя» — «люблю в тебе». Первые строфы — отрицание и объяснение. Финал — три параллельных образа (уста — устам, глаза — глазам, черты — чертам): синтаксический параллелизм усиливает образ двойного видения."},
      {n:"4",text:"Что сближает стихотворения А.С. Пушкина «Не пой, красавица, при мне...» и М.Ю. Лермонтова «Нет, не тебя так пылко я люблю...»?",
       poem2:`Не пой, красавица, при мне
Ты песен Грузии печальной:
Напоминают мне оне
Другую жизнь и берег дальный.
Увы! напоминают мне
Твои жестокие напевы
И степь, и ночь — и при луне
Черты далёкой, бедной девы!..
Я призрак милый, роковой,
Тебя увидев, забываю;
Но ты поёшь — и предо мной
Его я вновь воображаю.
(А.С. Пушкин, 1828)`,
       ref:"Оба стихотворения — о любви к прошлому, которое живёт в настоящем. Реальная женщина рядом, но герой любит другую — далёкую, ушедшую. У Пушкина — песня вызывает образ прошлого. У Лермонтова — черты лица. Общее: любовь-воспоминание сильнее любви живой. Различие: Пушкин просит не напоминать, Лермонтов прямо говорит о двойном видении."},

    work:"«Мёртвые души» (разговор Чичикова с Собакевичем)",
    text:`— Мы об вас вспоминали у председателя палаты, у Ивана Григорьевича, — сказал наконец Чичиков. — В прошедший четверг. Очень приятно провели там время.
— Да, я не был тогда у председателя, — отвечал Собакевич.
— А прекрасный человек!
— Кто такой? — сказал Собакевич, глядя на угол печи.
— Председатель.
— Ну, может быть, это вам так показалось: он только что масон, а такой дурак, какого свет не производил.
— Конечно, всякий человек не без слабостей, но зато губернатор какой превосходный человек!
— Губернатор превосходный человек?
— Да, не правда ли?
— Первый разбойник в мире!
— Как, губернатор разбойник? — сказал Чичиков. — Признаюсь, этого я бы никак не подумал.
— И лицо разбойничье! — сказал Собакевич. — Дайте ему только нож да выпустите на большую дорогу — зарежет, за копейку зарежет! Он да ещё вице-губернатор — это Гога и Магога!
— Мошенник! — сказал Собакевич об полицеймейстере очень хладнокровно, — продаст, обманет, ещё и пообедает с вами! Я их знаю всех: это всё мошенники, весь город там такой: мошенник на мошеннике сидит и мошенником погоняет. Все христопродавцы. Один там только и есть порядочный человек: прокурор; да и тот, если сказать правду, свинья.`,

  poem:{
    author:"С.А. Есенин",
    work:"«Край любимый! Сердцу снятся...» (1914)",
    text:`Край любимый! Сердцу снятся
Скирды солнца в водах лонных.
Я хотел бы затеряться
В зеленях твоих стозвонных.
По меже, на перемётке,
Резеда и риза кашки.
И вызванивают в чётки
Ивы — кроткие монашки.
Курит облаком болото,
Гарь в небесном коромысле.
С тихой тайной для кого-то
Затаил я в сердце мысли.
Всё встречаю, всё приемлю,
Рад и счастлив душу вынуть.
Я пришёл на эту землю,
Чтоб скорей её покинуть.`,
    qs:[
      {n:"3.1",text:"В каких строчках стихотворения прозвучало «признание» поэта в любви к родному краю?",ref:"Признание — в первых строках: «Край любимый! Сердцу снятся...» и «Я хотел бы затеряться в зеленях твоих стозвонных». Это прямое обращение к родине с любовью. Но главное «признание» парадоксально: «Я пришёл на эту землю, чтоб скорей её покинуть» — любовь через принятие смерти, через растворение в природе."},
      {n:"3.2",text:"Как тема любви к родине связана в стихотворении С.А. Есенина с темой скоротечности земного бытия?",ref:"Финальные строки — парадокс: поэт любит землю и одновременно готов её покинуть. Скоротечность жизни не ужасает — она принимается как часть природного цикла. Любовь к родине у Есенина пронизана ощущением временности, хрупкости: красота дорога именно потому, что мимолётна."},
      {n:"4",text:"Что объединяет образы родины в стихотворениях С.А. Есенина «Край любимый...» и Н.М. Рубцова «Тихая моя родина»?",
       poem2:`Тихая моя родина!
Ивы, река, соловьи...
Мать моя здесь похоронена
В детские годы мои.
Где же погост? Вы не видели?
Сам я найти не могу. —
Тихо ответили жители,
Тихо проехал я мглу.
Тихая моя родина,
Я ничего не забыл.
Новый забор перед школою,
Тот же зелёный простор.
Сердце — как в детство — защёлкало,
Больно от птичьих свистов.
(Н.М. Рубцов)`,
       ref:"Оба поэта создают образ «тихой» родины: у Есенина — «зеленя стозвонные», у Рубцова — «тихая родина». Общее: родина связана с детством, природой, ощущением растворения в ней. Различие: у Есенина — философское принятие смерти, у Рубцова — острая боль воспоминаний, тема утраты (мать похоронена)."},

    work:"«Судьба человека» (эпизод в плену)",
    text:`...Ночевать загнали нас в церковь с разбитым куполом. На каменном полу — ни клочка соломы, а все мы без шинелей, в одних гимнастёрках и штанах.

Отвечаю ему: «А тебе что надо, браток?» Он и говорит: «Я — военврач, может быть, могу тебе чем-нибудь помочь?» Я пожаловался ему, что у меня левое плечо скрипит и пухнет и ужасно как болит. Он твёрдо так говорит: «Сымай гимнастёрку и нижнюю рубашку». Начал руку в плече прощупывать... как дёрнет мою руку, аж красные искры у меня из глаз посыпались.
Опомнился я и спрашиваю: «Ты что же делаешь, фашист несчастный?» Слышу, он засмеялся потихоньку и говорит: «Думал, что ты меня ударишь с правой, но ты, оказывается, смирный парень. А рука у тебя не разбита, а выбита была, вот я её на место и поставил. Ну, как теперь, полегче тебе?» Поблагодарил я его душевно, и он дальше пошёл в темноте, потихоньку спрашивает: «Раненые есть?» Вот что значит настоящий доктор! Он и в плену и в потёмках своё великое дело делал.`,

  poem:{
    author:"В.А. Жуковский",
    work:"«Море» (элегия, 1822)",
    text:`Безмолвное море, лазурное море,
Стою очарован над бездной твоей.
Ты живо; ты дышишь; смятенной любовью,
Тревожною думой наполнено ты.
Безмолвное море, лазурное море,
Открой мне глубокую тайну твою:
Что движет твоё необъятное лоно?
Чем дышит твоя напряжённая грудь?
Иль тянет тебя из земныя неволи
Далёкое светлое небо к себе?..
Ты чисто в присутствии чистом его:
Ты льёшься его светозарной лазурью,
Вечерним и утренним светом горишь.
Когда же сбираются тёмные тучи,
Чтоб ясное небо отнять у тебя —
Ты бьёшься, ты воешь, ты волны подъемлешь,
Ты рвёшь и терзаешь враждебную мглу...
И мгла исчезает, и тучи уходят,
Но, полное прошлой тревоги своей,
Ты долго вздымаешь испуганны волны.`,

      {n:"3.2",text:"Какие черты романтизма проявляются в элегии Жуковского «Море»?",ref:"Черты романтизма: образ бесконечного, таинственного (море как бездна), двоемирие (земля/небо, реальность/идеал), одушевление природы (море «дышит», «тревожится»), лирическое «я», стоящее перед тайной мироздания. Элегическое настроение — тоска по недостижимому идеалу."},

       poem2:`Прощай, свободная стихия!

Перенесу, тобою полн,

(А.С. Пушкин, 1824)`,

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let currentVar = 0;
const answers = JSON.parse(localStorage.getItem('oge_lit_answers') || '{}');

function saveAnswers() {
  localStorage.setItem('oge_lit_answers', JSON.stringify(answers));
}

function getAnswerKey(vn, qn, field) {
  return `v${vn}_${qn}_${field}`;
}

// ══════════════════════════════════════════════════════
// BUILD UI
// ══════════════════════════════════════════════════════
function buildGrid() {
  const grid = document.getElementById('varGrid');
  grid.innerHTML = '';
  VARIANTS.forEach((v, i) => {
    const done = isVariantDone(v.n);
    const prog = getVariantProgress(v.n);
    const btn = document.createElement('div');
    btn.className = 'var-btn' + (i === currentVar ? ' active' : '') + (done ? ' done' : '');
    btn.innerHTML = `<div class="var-n">${v.n}</div><div class="var-prog">${prog}%</div>`;
    btn.onclick = () => selectVariant(i);
    grid.appendChild(btn);
  });
}

function getVariantProgress(vn) {
  const v = VARIANTS.find(x => x.n === vn);
  if (!v) return 0;
  const totalQ = v.prose.qs.length + v.poem.qs.length;
  let filled = 0;
  v.prose.qs.forEach(q => { if (answers[getAnswerKey(vn, q.n, 'text')]?.trim()) filled++; });
  v.poem.qs.forEach(q => { if (answers[getAnswerKey(vn, q.n, 'text')]?.trim()) filled++; });
  return Math.round(filled / totalQ * 100);
}

function isVariantDone(vn) {
  return getVariantProgress(vn) === 100;
}

function selectVariant(i) {
  currentVar = i;
  document.querySelectorAll('.var-btn').forEach((b, j) => {
    b.classList.toggle('active', j === i);
  });
  document.querySelectorAll('.var-content').forEach((c, j) => {
    c.classList.toggle('active', j === i);
  });
  document.getElementById('botNav').style.display = 'flex';
  document.getElementById('navInfo').textContent = `Вариант ${i + 1} из ${VARIANTS.length}`;
  updateTotalProgress();
}

function buildContents() {
  const container = document.getElementById('varContents');
  container.innerHTML = '';
  VARIANTS.forEach((v, vi) => {
    const div = document.createElement('div');
    div.className = 'var-content' + (vi === 0 ? ' active' : '');
    div.innerHTML = buildVariantHTML(v);
    container.appendChild(div);
  });
}

function buildVariantHTML(v) {
  let html = `
    <div class="part-title">Часть 1 · Эпическое / Драматическое произведение</div>
    <div class="work-title">${v.prose.work}</div>
    <div class="author">${v.prose.author}</div>
    <div class="txt-block" id="prose_${v.n}">${v.prose.text.replace(/\n/g,'<br>')}</div>
    <div class="expand-btn" onclick="toggleExpand('prose_${v.n}', this)">▼ Читать полностью</div>
  `;

  v.prose.qs.forEach(q => {
    const key = getAnswerKey(v.n, q.n, 'text');
    const saved = answers[key] || '';
    html += buildQuestion(v.n, q, saved);
  });

  html += `<div class="divider"></div>
    <div class="part-title">Часть 1 · Лирическое произведение</div>
    <div class="work-title">${v.poem.work}</div>
    <div class="author">${v.poem.author}</div>
    <div class="txt-block poem">${v.poem.text}</div>
  `;

  v.poem.qs.forEach(q => {
    const key = getAnswerKey(v.n, q.n, 'text');
    const saved = answers[key] || '';
    if (q.poem2) {
      html += `<div class="q-block">
        <div class="q-num">Задание ${q.n} · Сопоставление</div>
        <div class="q-text">${q.text}</div>
        <div class="txt-block poem" style="margin-bottom:10px;font-size:12px">${q.poem2.replace(/\n/g,'<br>')}</div>
        <div class="q-hint">Объём: 5–8 предложений. Опирайся на оба текста.</div>
        <textarea class="answer-area" id="ta_${v.n}_${q.n}" placeholder="Пиши свой ответ..." onchange="saveAnswer(${v.n},'${q.n}',this.value)">${saved}</textarea>
        <div class="q-actions">
          <button class="btn-ref" onclick="toggleRef('ref_${v.n}_${q.n}')">💡 Ключевые тезисы</button>
          <button class="btn-save" onclick="markSaved(${v.n},'${q.n}',this)">✓ Записал</button>
        </div>
        <div class="ref-block" id="ref_${v.n}_${q.n}"><div class="ref-label">Ключевые тезисы</div>${q.ref}</div>
        ${buildRating(v.n, q.n)}
        <div class="saved-badge ${answers[getAnswerKey(v.n,q.n,'saved')]?'show':''}" id="badge_${v.n}_${q.n}">✅ Ответ сохранён</div>
      </div>`;
    } else {
      html += buildQuestion(v.n, q, saved);
    }
  });

  html += `<div class="divider">
    <div class="part-title" style="padding:0 0 10px">Часть 2 · Темы сочинений (выбери одну)</div>
  `;
  v.essays.forEach((e, i) => {
    html += `<div class="essay-block">
      <div class="essay-num">5.${i+1}</div>
      <div class="essay-text">${e}</div>
    </div>`;
  });

  return html;
}

function buildRating(vn, qn) {
  const cur = parseInt(answers[getAnswerKey(vn, qn, 'rating')] || '0');
  const labels = ['','Слабо','Неплохо','Хорошо','Отлично','Отлично!'];
  return `<div class="rating-row">
    <div class="rating-lbl">Самооценка:</div>
    <div class="stars">
      ${[1,2,3,4,5].map(i => `<div class="star ${cur>=i?'active':''}" onclick="setRating(${vn},'${qn}',${i})" id="star_${vn}_${qn}_${i}">${i<=cur?'★':'☆'}</div>`).join('')}
    </div>
    <div class="rating-val" id="rval_${vn}_${qn}">${cur ? labels[cur] : ''}</div>
  </div>`;
}

function buildQuestion(vn, q, saved) {
  return `<div class="q-block">
    <div class="q-num">Задание ${q.n}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-hint">Объём: 3–5 предложений. Опирайся на текст.</div>
    <textarea class="answer-area" id="ta_${vn}_${q.n}" placeholder="Пиши свой ответ..." onchange="saveAnswer(${vn},'${q.n}',this.value)">${saved}</textarea>
    <div class="q-actions">
      <button class="btn-ref" onclick="toggleRef('ref_${vn}_${q.n}')">💡 Ключевые тезисы</button>
      <button class="btn-save" onclick="markSaved(${vn},'${q.n}',this)">✓ Записал</button>
    </div>
    <div class="ref-block" id="ref_${vn}_${q.n}"><div class="ref-label">Ключевые тезисы для проверки</div>${q.ref}</div>
    ${buildRating(vn, q.n)}
    <div class="saved-badge ${answers[getAnswerKey(vn,q.n,'saved')]?'show':''}" id="badge_${vn}_${q.n}">✅ Ответ сохранён</div>
  </div>`;
}

// ══════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════
function toggleExpand(id, btn) {
  const el = document.getElementById(id);
  el.classList.toggle('expanded');
  btn.textContent = el.classList.contains('expanded') ? '▲ Свернуть' : '▼ Читать полностью';
}

function toggleRef(id) {
  document.getElementById(id).classList.toggle('show');
}

function saveAnswer(vn, qn, val) {
  answers[getAnswerKey(vn, qn, 'text')] = val;
  saveAnswers();
  buildGrid();
  updateTotalProgress();
}

function setRating(vn, qn, val) {
  answers[getAnswerKey(vn, qn, 'rating')] = String(val);
  saveAnswers();
  const labels = ['','Слабо','Неплохо','Хорошо','Отлично','Отлично!'];
  // update stars
  [1,2,3,4,5].forEach(i => {
    const s = document.getElementById(`star_${vn}_${qn}_${i}`);
    if (s) {
      s.classList.toggle('active', i <= val);
      s.textContent = i <= val ? '★' : '☆';
    }
  });
  const rv = document.getElementById(`rval_${vn}_${qn}`);
  if (rv) rv.textContent = labels[val];
  updateReport();
  showToast('⭐ Оценка сохранена');
}

function updateReport() {
  const list = document.getElementById('reportList');
  const rows = [];
  VARIANTS.forEach(v => {
    const allQs = [...v.prose.qs, ...v.poem.qs];
    const ratings = allQs.map(q => parseInt(answers[getAnswerKey(v.n, q.n, 'rating')] || '0')).filter(r => r > 0);
    if (ratings.length === 0) return;
    const avg = (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
    const stars = '★'.repeat(Math.round(parseFloat(avg))) + '☆'.repeat(5 - Math.round(parseFloat(avg)));
    const color = avg >= 4 ? 'var(--gr)' : avg >= 3 ? 'var(--g)' : 'var(--r)';
    rows.push(`<div class="report-row">
      <div class="report-var">Вариант ${v.n} <span style="font-size:10px;color:var(--m)">(${ratings.length}/${allQs.length} оценено)</span></div>
      <div class="report-stars" style="color:var(--g)">${stars}</div>
      <div class="report-avg" style="color:${color}">${avg}</div>
    </div>`);
  });
  list.innerHTML = rows.length ? rows.join('') : '<div class="report-empty">Оцени задания — здесь появится отчёт</div>';
}

function markSaved(vn, qn, btn) {
  const ta = document.getElementById(`ta_${vn}_${qn}`);
  if (ta) answers[getAnswerKey(vn, qn, 'text')] = ta.value;
  answers[getAnswerKey(vn, qn, 'saved')] = '1';
  saveAnswers();
  const badge = document.getElementById(`badge_${vn}_${qn}`);
  if (badge) badge.classList.add('show');
  buildGrid();
  updateTotalProgress();
  showToast('✅ Сохранено!');
}

function updateTotalProgress() {
  const total = VARIANTS.reduce((s, v) => {
    return s + v.prose.qs.length + v.poem.qs.length;
  }, 0);
  const filled = VARIANTS.reduce((s, v) => {
    let f = 0;
    v.prose.qs.forEach(q => { if (answers[getAnswerKey(v.n, q.n, 'text')]?.trim()) f++; });
    v.poem.qs.forEach(q => { if (answers[getAnswerKey(v.n, q.n, 'text')]?.trim()) f++; });
    return s + f;
  }, 0);
  const pct = Math.round(filled / total * 100);
  document.getElementById('totalProg').textContent = pct + '%';
  document.getElementById('totalFill').style.width = pct + '%';
}

function navVariant(dir) {
  const next = currentVar + dir;
  if (next < 0 || next >= VARIANTS.length) return;
  selectVariant(next);
  window.scrollTo(0, 0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
buildContents();
buildGrid();
updateTotalProgress();
updateReport();
document.getElementById('navInfo').textContent = `Вариант 1 из ${VARIANTS.length}`;
</script>
</body>
</html>
